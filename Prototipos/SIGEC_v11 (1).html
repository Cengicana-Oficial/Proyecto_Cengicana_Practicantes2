<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIGEC v11 · Sistema de Gestión de Ensayos · Cengicaña</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --verde:#73BC25;
  --verde-sec:#A3D300;
  --amarillo:#FFCC00;
  --naranja:#FF6B00;
  --gris:#CED2D5;
  --blanco:#ffffff;
  --gris-fondo:#F5F7F4;
  --texto:#2A3A1F;
  --texto-suave:#6B7568;
  --borde:#E3E7E1;
  --sombra:0 2px 10px rgba(40,60,20,.07);
  --sombra-lg:0 12px 32px rgba(40,60,20,.14);
  --radio:12px;
  --sidebar-w:260px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;
  background:var(--gris-fondo);
  color:var(--texto);
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none;}
ul{list-style:none;}
button{font-family:inherit;cursor:pointer;border:none;}
input,select,textarea{font-family:inherit;}

/* ===== LOGIN ===== */
#login-screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#1f3d0f 0%,#3c6b16 38%,var(--verde) 100%);
  position:relative;
  overflow:hidden;
  padding:20px;
}
#login-screen::before{
  content:"";
  position:absolute;inset:0;
  background:
    radial-gradient(circle at 15% 20%, rgba(255,204,0,.18), transparent 40%),
    radial-gradient(circle at 85% 80%, rgba(255,107,0,.15), transparent 45%);
}
.login-card{
  position:relative;
  background:var(--blanco);
  width:100%;max-width:420px;
  border-radius:18px;
  box-shadow:var(--sombra-lg);
  padding:38px 36px 30px;
}
.login-brand{display:flex;align-items:center;gap:12px;margin-bottom:6px;}
.login-brand .logo{
  width:46px;height:46px;border-radius:10px;
  background:linear-gradient(135deg,var(--verde),var(--verde-sec));
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;font-weight:700;
}
.login-brand h1{font-size:20px;font-weight:700;color:var(--texto);}
.login-brand span{font-size:12px;color:var(--texto-suave);display:block;}
.login-card h2{margin-top:22px;font-size:15px;color:var(--texto-suave);font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
.field{margin-top:16px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--texto-suave);margin-bottom:6px;}
.field select,.field input{
  width:100%;padding:11px 13px;border:1.5px solid var(--borde);border-radius:9px;font-size:14px;background:#fafbf9;transition:.15s;
}
.field select:focus,.field input:focus{outline:none;border-color:var(--verde);background:#fff;}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px;}
.role-chip{
  border:1.5px solid var(--borde);border-radius:10px;padding:10px 8px;text-align:center;font-size:12.5px;font-weight:600;color:var(--texto-suave);
}
.role-chip.active{border-color:var(--verde);background:#f1f9e8;color:var(--verde);}
.btn-login{
  margin-top:22px;width:100%;padding:13px;border-radius:10px;background:var(--verde);color:#fff;font-weight:700;font-size:14.5px;
  box-shadow:0 6px 16px rgba(115,188,37,.35);transition:.15s;
}
.btn-login:hover{background:#65a51f;}
.login-hint{margin-top:16px;font-size:11.5px;color:var(--texto-suave);text-align:center;line-height:1.5;}

/* ===== APP SHELL ===== */
#app{display:none;min-height:100vh;}
.sidebar{
  width:var(--sidebar-w);background:#1c2d12;color:#fff;
  position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column;
  transition:width .2s ease;z-index:50;
}
.sidebar.collapsed{width:74px;}
.side-head{display:flex;align-items:center;gap:12px;padding:20px 18px;border-bottom:1px solid rgba(255,255,255,.08);}
.side-head .logo{
  width:38px;height:38px;border-radius:9px;flex-shrink:0;
  background:linear-gradient(135deg,var(--verde),var(--verde-sec));display:flex;align-items:center;justify-content:center;font-weight:700;
}
.side-head .brandtxt{overflow:hidden;white-space:nowrap;}
.side-head .brandtxt b{display:block;font-size:14.5px;}
.side-head .brandtxt small{font-size:10.5px;color:#a9b89c;}
.sidebar.collapsed .brandtxt{display:none;}
.side-nav{flex:1;overflow-y:auto;padding:14px 10px;}
.nav-section-title{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#7f9069;padding:14px 12px 6px;}
.sidebar.collapsed .nav-section-title{display:none;}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;color:#d3ddc8;font-size:13.5px;font-weight:500;margin-bottom:2px;
}
.nav-item i{width:18px;text-align:center;font-size:15px;flex-shrink:0;}
.nav-item span{white-space:nowrap;overflow:hidden;}
.sidebar.collapsed .nav-item span{display:none;}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-item.active{background:var(--verde);color:#fff;}
.side-foot{padding:14px 16px;border-top:1px solid rgba(255,255,255,.08);}
.collapse-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:8px;border-radius:8px;background:rgba(255,255,255,.06);color:#cdd6c1;font-size:12px;}
.collapse-btn:hover{background:rgba(255,255,255,.12);}

.main{margin-left:var(--sidebar-w);transition:margin-left .2s ease;min-height:100vh;display:flex;flex-direction:column;}
.main.collapsed{margin-left:74px;}
.topbar{
  height:64px;background:#fff;border-bottom:1px solid var(--borde);display:flex;align-items:center;justify-content:space-between;
  padding:0 26px;position:sticky;top:0;z-index:30;
}
.topbar-left{display:flex;align-items:center;gap:16px;}
.burger{font-size:18px;color:var(--texto-suave);}
.breadcrumb{font-size:13px;color:var(--texto-suave);display:flex;align-items:center;gap:6px;}
.breadcrumb b{color:var(--texto);font-weight:700;}
.topbar-right{display:flex;align-items:center;gap:18px;}
.role-badge{
  font-size:11px;font-weight:700;padding:5px 11px;border-radius:20px;background:#f1f9e8;color:var(--verde);text-transform:uppercase;letter-spacing:.03em;
}
.user-chip{display:flex;align-items:center;gap:10px;cursor:pointer;}
.user-chip .avatar{
  width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--naranja),var(--amarillo));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;
}
.user-chip .uinfo{line-height:1.25;}
.user-chip .uinfo b{display:block;font-size:13px;}
.user-chip .uinfo small{font-size:11px;color:var(--texto-suave);}
.logout-btn{color:var(--texto-suave);font-size:16px;}
.logout-btn:hover{color:var(--naranja);}

.content{padding:24px 28px 50px;flex:1;}
.page{display:none;}
.page.active{display:block;animation:fadein .25s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.page-header{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:22px;}
.page-header h1{font-size:22px;font-weight:700;}
.page-header p{font-size:13px;color:var(--texto-suave);margin-top:3px;}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:9px;font-size:13.5px;font-weight:600;transition:.15s;}
.btn-primary{background:var(--verde);color:#fff;}
.btn-primary:hover{background:#65a51f;}
.btn-secondary{background:#fff;color:var(--texto);border:1.5px solid var(--borde);}
.btn-secondary:hover{background:#f5f5f3;}
.btn-danger{background:#fde7e0;color:#c4471b;}
.btn-danger:hover{background:#fbd6c8;}
.btn-sm{padding:6px 10px;font-size:12px;border-radius:7px;}
.btn-icon{width:32px;height:32px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;background:#f2f4f0;color:var(--texto-suave);}
.btn-icon:hover{background:var(--gris);color:var(--texto);}

/* Cards / KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:22px;}
.kpi-card{background:#fff;border-radius:var(--radio);padding:18px 20px;box-shadow:var(--sombra);border-left:4px solid var(--verde);}
.kpi-card .kpi-top{display:flex;justify-content:space-between;align-items:flex-start;}
.kpi-card .kpi-icon{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;}
.kpi-card .kpi-val{font-size:26px;font-weight:800;margin-top:14px;}
.kpi-card .kpi-label{font-size:12.5px;color:var(--texto-suave);margin-top:2px;}
.kpi-card .kpi-trend{font-size:11px;font-weight:700;margin-top:8px;display:inline-flex;align-items:center;gap:4px;}

.grid-2{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
@media(max-width:1100px){.grid-2,.grid-3{grid-template-columns:1fr;}}

.card{background:#fff;border-radius:var(--radio);box-shadow:var(--sombra);padding:20px 22px;margin-bottom:18px;}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.card-head h3{font-size:15px;font-weight:700;}
.card-head .muted{font-size:12px;color:var(--texto-suave);}

/* fake chart bars */
.bar-chart{display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:10px;}
.bar-chart .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;}
.bar-chart .bar{width:100%;border-radius:6px 6px 0 0;background:linear-gradient(180deg,var(--verde-sec),var(--verde));}
.bar-chart .bar-lbl{font-size:10.5px;color:var(--texto-suave);}
.donut-wrap{display:flex;align-items:center;gap:18px;}
.legend-item{display:flex;align-items:center;gap:8px;font-size:12.5px;margin-bottom:8px;}
.legend-dot{width:10px;height:10px;border-radius:3px;}

.activity-list .act-item{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--borde);}
.activity-list .act-item:last-child{border-bottom:none;}
.act-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;flex-shrink:0;}
.act-text b{font-size:13px;}
.act-text p{font-size:12px;color:var(--texto-suave);margin-top:1px;}
.act-time{font-size:10.5px;color:#a3ad9a;margin-left:auto;white-space:nowrap;}

/* tables */
.table-toolbar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px;}
.search-box{position:relative;}
.search-box i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--texto-suave);font-size:13px;}
.search-box input{padding:9px 12px 9px 32px;border:1.5px solid var(--borde);border-radius:9px;font-size:13px;width:240px;background:#fafbf9;}
.search-box input:focus{outline:none;border-color:var(--verde);}
.filter-select{padding:9px 12px;border:1.5px solid var(--borde);border-radius:9px;font-size:13px;background:#fafbf9;}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--texto-suave);padding:10px 14px;border-bottom:2px solid var(--borde);}
tbody td{padding:12px 14px;border-bottom:1px solid var(--borde);}
tbody tr:hover{background:#fafbf8;}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;}
.tag-green{background:#eaf6db;color:#4d8a13;}
.tag-yellow{background:#fff6da;color:#a87900;}
.tag-orange{background:#ffe7d6;color:#c4500f;}
.tag-gray{background:#eceeec;color:#6a7466;}
.tag-blue{background:#e2f0ff;color:#1f6fbf;}
.row-actions{display:flex;gap:6px;}
.pagination{display:flex;justify-content:flex-end;align-items:center;gap:6px;margin-top:14px;}
.page-btn{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12.5px;background:#f2f4f0;color:var(--texto-suave);}
.page-btn.active{background:var(--verde);color:#fff;}
.empty-state{text-align:center;padding:50px 20px;color:var(--texto-suave);}
.empty-state i{font-size:34px;margin-bottom:12px;color:var(--gris);}

/* modal */
.modal-overlay{
  display:none;position:fixed;inset:0;background:rgba(20,30,12,.45);z-index:200;align-items:center;justify-content:center;padding:20px;
}
.modal-overlay.show{display:flex;}
.modal{background:#fff;border-radius:16px;max-width:780px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:var(--sombra-lg);animation:modalin .2s ease;}
@keyframes modalin{from{opacity:0;transform:translateY(14px) scale(.98);}to{opacity:1;transform:translateY(0) scale(1);}}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid var(--borde);}
.modal-head h3{font-size:16px;font-weight:700;}
.modal-close{font-size:16px;color:var(--texto-suave);width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;}
.modal-close:hover{background:#f2f4f0;}
.modal-body{padding:22px 24px;}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 24px;border-top:1px solid var(--borde);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.form-group{margin-bottom:14px;}
.form-group label{display:block;font-size:12.5px;font-weight:600;color:var(--texto-suave);margin-bottom:6px;}
.form-group input,.form-group select,.form-group textarea{
  width:100%;padding:10px 12px;border:1.5px solid var(--borde);border-radius:9px;font-size:13.5px;background:#fafbf9;
}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--verde);background:#fff;}
.form-group textarea{resize:vertical;min-height:70px;}
.form-error{font-size:11.5px;color:#c4471b;margin-top:5px;display:none;}
.form-group.invalid input,.form-group.invalid select,.form-group.invalid textarea{border-color:#c4471b;}
.form-group.invalid .form-error{display:block;}

/* toasts */
#toast-wrap{position:fixed;top:20px;right:20px;z-index:400;display:flex;flex-direction:column;gap:10px;}
.toast{
  background:#fff;border-radius:11px;box-shadow:var(--sombra-lg);padding:13px 16px;display:flex;align-items:center;gap:11px;min-width:280px;
  border-left:4px solid var(--verde);animation:toastin .25s ease;
}
@keyframes toastin{from{opacity:0;transform:translateX(20px);}to{opacity:1;transform:translateX(0);}}
.toast.error{border-color:#c4471b;}
.toast.warn{border-color:var(--amarillo);}
.toast i{font-size:16px;color:var(--verde);}
.toast.error i{color:#c4471b;}
.toast.warn i{color:#c4a000;}
.toast b{font-size:13px;display:block;}
.toast span{font-size:11.5px;color:var(--texto-suave);}

.deny-banner{
  background:#fff3ee;border:1.5px solid #ffd2bb;color:#a8430f;padding:14px 18px;border-radius:11px;font-size:13px;display:flex;align-items:center;gap:10px;margin-bottom:18px;
}
.badge-count{background:var(--naranja);color:#fff;font-size:10px;border-radius:20px;padding:1px 7px;margin-left:6px;}
.access-restricted{font-size:11px;color:var(--texto-suave);background:#f2f4f0;padding:3px 9px;border-radius:20px;}

.breadcrumb-nav{font-size:12px;color:var(--texto-suave);margin-bottom:6px;}
.breadcrumb-nav b{color:var(--texto);}

.checklist{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;}
.checklist label{display:flex;align-items:center;gap:6px;font-size:12.5px;background:#f2f4f0;padding:6px 11px;border-radius:8px;font-weight:500;color:var(--texto);}
.checklist input{width:auto;}

.dropzone{
  border:2px dashed var(--gris);border-radius:13px;padding:30px 20px;text-align:center;background:#fafbf9;cursor:pointer;transition:.15s;
}
.dropzone:hover,.dropzone.drag{border-color:var(--verde);background:#f3faec;}
.dropzone i{font-size:30px;color:var(--verde);margin-bottom:10px;display:block;}
.dropzone b{font-size:13.5px;display:block;}
.dropzone span{font-size:11.5px;color:var(--texto-suave);}
.stat-summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:16px;}
.stat-box{background:#f7f9f5;border-radius:10px;padding:12px 14px;}
.stat-box .v{font-size:19px;font-weight:800;}
.stat-box .l{font-size:11px;color:var(--texto-suave);margin-top:2px;}
.letters{font-weight:800;color:var(--verde);margin-left:6px;font-size:11px;}
.integration-box{
  background:#eef6ff;border:1.5px solid #c9e2fb;border-radius:11px;padding:14px 16px;font-size:12.5px;color:#1f4f7a;display:flex;gap:10px;
}
.integration-box i{font-size:16px;margin-top:1px;}
.ai-report-box{background:#fbf9f4;border:1.5px solid #ecdfc2;border-radius:11px;padding:18px 20px;font-size:13px;line-height:1.65;white-space:pre-wrap;}
.spin{animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.preview-wrap{max-height:260px;overflow:auto;border:1px solid var(--borde);border-radius:9px;margin-top:14px;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:#c9d2c2;border-radius:10px;}
::-webkit-scrollbar-track{background:transparent;}

@media(max-width:880px){
  .sidebar{transform:translateX(-100%);}
  .sidebar.mobile-open{transform:translateX(0);}
  .main{margin-left:0;}
  .form-row{grid-template-columns:1fr;}
  .grid-2,.grid-3{grid-template-columns:1fr;}
}

/* ===== TABS (ensayo detalle) ===== */
.tab-bar{display:flex;gap:4px;border-bottom:2px solid var(--borde);margin-bottom:20px;flex-wrap:wrap;}
.tab-btn{padding:10px 16px;border-radius:9px 9px 0 0;font-size:13px;font-weight:600;color:var(--texto-suave);background:transparent;border:none;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:7px;}
.tab-btn:hover{background:#f0f4ec;color:var(--texto);}
.tab-btn.active{color:var(--verde);border-bottom:2px solid var(--verde);margin-bottom:-2px;background:#f5faef;}
.tab-panel{display:none;}
.tab-panel.active{display:block;animation:fadein .2s ease;}

/* ===== MAPA ===== */
.map-wrap{height:340px;border-radius:var(--radio);overflow:hidden;border:1.5px solid var(--borde);}
.map-controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center;}
.gps-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:6px 12px;border-radius:20px;background:#eaf6db;color:#4d8a13;font-weight:600;}
.gps-badge.no-gps{background:#f2f4f0;color:var(--texto-suave);}
.parcela-popup b{display:block;font-size:13px;}
.parcela-popup span{font-size:11.5px;color:#555;}

/* ===== NDVI ===== */
.ndvi-legend{display:flex;gap:6px;align-items:center;font-size:11.5px;flex-wrap:wrap;margin-bottom:12px;}
.ndvi-chip{width:14px;height:14px;border-radius:3px;display:inline-block;}
.ndvi-bar-wrap{position:relative;height:180px;display:flex;align-items:flex-end;gap:8px;margin-top:10px;}
.ndvi-col{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;}
.ndvi-bar-outer{width:100%;background:#f0f4ec;border-radius:5px 5px 0 0;position:relative;height:150px;display:flex;align-items:flex-end;}
.ndvi-bar-inner{width:100%;border-radius:5px 5px 0 0;transition:height .4s ease;}
.ndvi-label{font-size:10px;color:var(--texto-suave);text-align:center;}
.ndvi-val{font-size:11px;font-weight:700;}
.ndvi-series-line{stroke-width:2;fill:none;}
.ndvi-dot{r:4;}

/* ===== CLIMA ===== */
.clima-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:14px;}
.clima-box{background:#f5faef;border-radius:10px;padding:12px 10px;text-align:center;}
.clima-box .cv{font-size:20px;font-weight:800;color:var(--texto);}
.clima-box .cl{font-size:10.5px;color:var(--texto-suave);margin-top:2px;}
.clima-box .ci{font-size:18px;margin-bottom:4px;}
.rain-bar-wrap{display:flex;align-items:flex-end;gap:6px;height:100px;margin-top:8px;}
.rain-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;}
.rain-bar{width:100%;background:linear-gradient(180deg,#60b4f5,#1f6fbf);border-radius:4px 4px 0 0;}
.rain-lbl{font-size:9.5px;color:var(--texto-suave);}

/* ===== ARCHIVOS POR PROYECTO ===== */
.file-tree{font-size:13px;}
.file-folder{padding:8px 0;border-bottom:1px solid var(--borde);}
.file-folder-head{display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:600;color:var(--texto);}
.file-folder-head i.fold-icon{color:var(--verde);font-size:14px;}
.file-folder-body{padding-left:22px;margin-top:6px;}
.file-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dotted var(--borde);}
.file-item:last-child{border-bottom:none;}
.file-item .fi-name{flex:1;font-size:12.5px;}
.file-item .fi-meta{font-size:11px;color:var(--texto-suave);}
.proj-filter-bar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap;}

/* ===== TRATAMIENTOS/PARCELAS inline ===== */
.struct-table-wrap{overflow-x:auto;}
.add-row-btn{margin-top:10px;}
.trat-row td input,.trat-row td select{width:100%;padding:6px 8px;border:1.5px solid var(--borde);border-radius:6px;font-size:12.5px;background:#fafbf9;}
.trat-row td input:focus,.trat-row td select:focus{outline:none;border-color:var(--verde);}
.info-pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:5px 10px;border-radius:20px;background:#eaf6db;color:#4d8a13;font-weight:600;}

/* ===== BITÁCORA ===== */
.bitacora-timeline{position:relative;padding-left:28px;}
.bitacora-timeline::before{content:'';position:absolute;left:9px;top:0;bottom:0;width:2px;background:var(--borde);}
.bit-entry{position:relative;margin-bottom:18px;}
.bit-dot{position:absolute;left:-23px;top:4px;width:14px;height:14px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 0 0 2px var(--verde);}
.bit-card{background:#fff;border:1.5px solid var(--borde);border-radius:10px;padding:14px 16px;transition:.15s;}
.bit-card:hover{border-color:var(--verde);box-shadow:0 2px 10px rgba(115,188,37,.12);}
.bit-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px;}
.bit-tipo{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;}
.bit-desc{font-size:13px;color:var(--texto);line-height:1.55;}
.bit-meta{font-size:11px;color:var(--texto-suave);margin-top:6px;display:flex;gap:12px;flex-wrap:wrap;}
.tipo-siembra{background:#eaf6db;color:#4d8a13;}
.tipo-fertilizacion{background:#fff6da;color:#a87900;}
.tipo-cosecha{background:#ffe7d6;color:#c4500f;}
.tipo-evaluacion{background:#e2f0ff;color:#1f6fbf;}
.tipo-muestreo{background:#f3e8ff;color:#7B2FBE;}
.tipo-aplicacion{background:#fde7e0;color:#c4471b;}
.tipo-otro{background:#eceeec;color:#6a7466;}

/* ===== ANÁLISIS MEJORADO ===== */
.stat-section{margin-top:22px;}
.stat-section-title{font-size:14px;font-weight:700;color:var(--texto);margin-bottom:14px;display:flex;align-items:center;gap:8px;padding-bottom:8px;border-bottom:2px solid var(--borde);}
.stat-section-title i{color:var(--verde);}
.chart-svg-wrap{background:#f9fbf7;border-radius:10px;padding:16px;overflow-x:auto;}
.data-table-wrap{overflow-x:auto;margin-top:10px;}
.data-table-wrap table{font-size:12px;}
.data-table-wrap thead th{font-size:10.5px;}
.context-box{background:#f5f0ff;border:1.5px solid #ddd2f0;border-radius:10px;padding:14px 16px;font-size:12.5px;color:#4a2080;margin-top:14px;line-height:1.6;}
.context-box b{display:block;font-size:13px;margin-bottom:6px;color:#3b1a6a;}

/* ===== MEMBERSHIP MATRIX ===== */
.member-matrix{width:100%;border-collapse:collapse;font-size:12px;}
.member-matrix th{background:#f2f4f0;padding:8px 10px;text-align:center;font-size:11px;font-weight:600;color:var(--texto-suave);}
.member-matrix th.user-col{text-align:left;min-width:160px;}
.member-matrix td{padding:7px 10px;border-bottom:1px solid var(--borde);text-align:center;}
.member-matrix td.user-name{text-align:left;font-weight:600;font-size:12.5px;}
.role-dot{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;cursor:pointer;transition:.15s;}
.role-dot:hover{transform:scale(1.12);}
.role-dot.none{background:#e8ebe6;color:#aab;cursor:pointer;}
.role-select-popup{position:absolute;background:#fff;border:1.5px solid var(--borde);border-radius:10px;box-shadow:var(--sombra-lg);padding:8px;z-index:999;min-width:200px;}
.role-opt{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:7px;cursor:pointer;font-size:12.5px;transition:.12s;}
.role-opt:hover{background:#f0f4ec;}
.role-legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:16px;}
.role-legend-item{display:flex;align-items:center;gap:6px;font-size:11.5px;}

/* ===== MUESTRA ID BADGE ===== */
.id-muestra-badge{font-family:'Courier New',monospace;font-size:13px;font-weight:700;background:#1f3d0f;color:#A3D300;padding:7px 14px;border-radius:8px;letter-spacing:.04em;display:inline-flex;align-items:center;gap:8px;}
.id-muestra-badge i{font-size:11px;}
.lab-card{background:#fff;border:1.5px solid var(--borde);border-radius:12px;padding:16px 18px;margin-bottom:12px;transition:.15s;}
.lab-card:hover{border-color:var(--verde);box-shadow:0 2px 12px rgba(115,188,37,.1);}
.lab-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
.lab-card-body{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;}
.lab-field{font-size:12px;}
.lab-field b{display:block;font-size:10.5px;color:var(--texto-suave);margin-bottom:2px;}
.lab-result-box{background:#f5faef;border:1.5px solid #d0e8b0;border-radius:8px;padding:10px 14px;margin-top:10px;font-size:13px;}
.lab-result-box b{display:block;font-size:11px;color:var(--texto-suave);margin-bottom:4px;}
.lab-search-bar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
.id-search-input{flex:1;padding:11px 14px;border:1.5px solid var(--borde);border-radius:10px;font-size:13.5px;font-family:'Courier New',monospace;}
.id-search-input:focus{outline:none;border-color:var(--verde);}

/* ===== FORMULARIOS DE CAMPO ===== */
.form-card{background:#fff;border:1.5px solid var(--borde);border-radius:12px;margin-bottom:12px;overflow:hidden;}
.form-card-head{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--borde);}
.form-card-body{padding:14px 18px;}
.campo-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--borde);font-size:12.5px;}
.campo-row:last-child{border-bottom:none;}
.campo-tipo-chip{font-size:10px;padding:2px 8px;border-radius:12px;background:#eaf6db;color:#4d8a13;font-weight:600;}
.asig-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:4px 9px;border-radius:14px;background:#e2f0ff;color:#1f6fbf;font-weight:600;margin:2px;}

/* ===== MÓDULO GENERACIÓN DE ID MUESTRAS ===== */
.muestreo-layout{display:grid;grid-template-columns:1fr;gap:16px;}
.info-general-panel{background:#fff;border:1.5px solid var(--borde);border-radius:var(--radio);padding:20px 22px;}
.info-general-panel h3{font-size:14px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px;color:var(--texto);}
.sample-table-wrap{background:#fff;border:1.5px solid var(--borde);border-radius:var(--radio);overflow:hidden;}
.sample-table-header{padding:16px 20px;border-bottom:1.5px solid var(--borde);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
.sample-table-header h3{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;}
.sample-table-scroll{overflow-x:auto;}
.sample-table{width:100%;border-collapse:collapse;font-size:12.5px;}
.sample-table thead tr{background:#f5f7f4;}
.sample-table th{padding:10px 12px;text-align:left;font-size:11px;font-weight:700;color:var(--texto-suave);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;border-bottom:1.5px solid var(--borde);}
.sample-table td{padding:8px 10px;border-bottom:1px solid var(--borde);vertical-align:middle;}
.sample-table tr:last-child td{border-bottom:none;}
.sample-table tr:hover td{background:#fafcf8;}
.id-cell{font-family:'Courier New',monospace;font-size:11.5px;font-weight:700;color:#1a3a08;background:#e8f5d0;padding:5px 9px;border-radius:6px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;}
.sample-td-input{width:100%;min-width:90px;padding:6px 8px;border:1.5px solid var(--borde);border-radius:7px;font-size:12.5px;background:#fafbf9;transition:.12s;}
.sample-td-input:focus{outline:none;border-color:var(--verde);background:#fff;}
.sample-td-select{width:100%;min-width:100px;padding:6px 8px;border:1.5px solid var(--borde);border-radius:7px;font-size:12.5px;background:#fafbf9;}
.sample-td-select:focus{outline:none;border-color:var(--verde);}
.del-row-btn{width:28px;height:28px;border-radius:7px;background:#fff0ee;border:1.5px solid #fdd;color:#c4471b;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px;transition:.12s;flex-shrink:0;}
.del-row-btn:hover{background:#fdd;border-color:#c4471b;}
.add-row-btn{display:flex;align-items:center;gap:6px;padding:10px 18px;border-radius:9px;border:1.5px dashed var(--verde);background:#f5faef;color:var(--verde);font-size:13px;font-weight:600;cursor:pointer;transition:.15s;margin:12px 16px;}
.add-row-btn:hover{background:#eaf6db;border-style:solid;}
.save-bar{display:flex;gap:10px;align-items:center;padding:14px 20px;border-top:1.5px solid var(--borde);background:#fafcf8;flex-wrap:wrap;}
.counter-badge{font-size:12px;color:var(--texto-suave);margin-left:auto;}

/* ===== ETIQUETAS ===== */
.etiqueta-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;padding:18px;}
.etiqueta{border:1.5px solid var(--borde);border-radius:10px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:8px;background:#fff;page-break-inside:avoid;}
.etiqueta-qr{width:90px;height:90px;display:flex;align-items:center;justify-content:center;}
.etiqueta-qr canvas,.etiqueta-qr img{width:90px!important;height:90px!important;}
.etiqueta-id{font-family:'Courier New',monospace;font-size:9.5px;font-weight:700;color:#1a3a08;text-align:center;word-break:break-all;line-height:1.4;}
.etiqueta-logo{font-size:9px;color:var(--texto-suave);text-align:center;border-top:1px solid var(--borde);padding-top:6px;width:100%;}
@media print{
  body *{visibility:hidden;}
  #print-area,#print-area *{visibility:visible;}
  #print-area{position:fixed;inset:0;background:#fff;padding:10px;}
  .etiqueta{border:1px solid #ccc;}
}

/* ===== CONSULTA MUESTRAS ===== */
.consulta-filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px;}
.result-card{background:#fff;border:1.5px solid var(--borde);border-radius:12px;margin-bottom:12px;overflow:hidden;transition:.15s;}
.result-card:hover{border-color:var(--verde);box-shadow:0 2px 12px rgba(115,188,37,.1);}
.result-card-head{padding:14px 18px;border-bottom:1px solid var(--borde);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.result-card-body{padding:14px 18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;}
.result-field{font-size:12px;}
.result-field b{display:block;font-size:10.5px;color:var(--texto-suave);margin-bottom:2px;text-transform:uppercase;letter-spacing:.03em;}
.ciclo-timeline{display:flex;align-items:center;gap:0;margin-top:10px;padding:10px 0 0;border-top:1px solid var(--borde);}
.ciclo-step{display:flex;flex-direction:column;align-items:center;flex:1;position:relative;}
.ciclo-step::after{content:'';position:absolute;top:13px;left:50%;width:100%;height:2px;background:var(--borde);z-index:0;}
.ciclo-step:last-child::after{display:none;}
.ciclo-dot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;z-index:1;border:2px solid var(--borde);background:#fff;}
.ciclo-dot.done{background:var(--verde);border-color:var(--verde);color:#fff;}
.ciclo-dot.active{background:var(--naranja);border-color:var(--naranja);color:#fff;}
.ciclo-lbl{font-size:9.5px;color:var(--texto-suave);margin-top:4px;text-align:center;}

/* ===== LAB BD MATRICIAL ===== */
.lab-tabs{display:flex;gap:4px;margin-bottom:16px;background:#fff;border:1.5px solid var(--borde);border-radius:10px;padding:4px;}
.lab-tab{flex:1;padding:8px 14px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--texto-suave);background:transparent;border:none;cursor:pointer;transition:.15s;text-align:center;}
.lab-tab.active{background:#1f6fbf;color:#fff;box-shadow:0 2px 8px rgba(31,111,191,.3);}
.lab-tab:hover:not(.active){background:#f0f4fc;color:var(--texto);}
.lab-mat-scroll{overflow-x:auto;border-radius:10px;border:1.5px solid var(--borde);margin-bottom:10px;}
.lmt{border-collapse:collapse;font-size:12px;width:100%;min-width:700px;}
.lmt thead th{background:#0d2d52;color:#fff;padding:8px 9px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;position:sticky;top:0;z-index:2;}
.lmt th.th-eta{background:#0d2d52;text-align:left;}
.lmt th.th-grp{background:#0d2d52;text-align:center;border-left:2px solid rgba(255,255,255,.25);}
.lmt th.th-ana{background:#163d6e;text-align:center;border-left:1px solid rgba(255,255,255,.1);}
.lmt tbody tr:nth-child(even) td{background:#f7faff;}
.lmt tbody tr:hover td{background:#e8f0fb!important;}
.lmt td{padding:0;border-bottom:1px solid var(--borde);border-right:1px solid #e8ecf5;vertical-align:middle;}
.lmt td.eta{padding:7px 9px;font-size:12px;white-space:nowrap;}
.lmt td.eta b{display:block;font-size:11px;color:#0d2d52;font-family:monospace;}
.lmt td.eta span{font-size:10.5px;color:var(--texto-suave);}
.lmt td.ana-cell{min-width:68px;max-width:90px;}
.lmt td.na-cell{background:#f8f9fb;}
.ana-in{display:flex;align-items:center;justify-content:center;min-height:40px;padding:4px 5px;border-left:1px solid #e8ecf5;cursor:pointer;}
.ana-in:hover{background:#dbeafe;}
.grp-left .ana-in{border-left:2px solid #93c5fd;}
.ana-with{background:#eff6ff;}
.ana-val{font-size:12.5px;font-weight:700;color:#0d2d52;text-align:center;}
.ana-unit{font-size:9px;color:var(--texto-suave);text-align:center;display:block;}
.ana-empty{color:#cbd5e1;font-size:15px;}
.est-comp{display:inline-flex;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:600;background:#d4edab;color:#3a6b10;}
.est-proc{display:inline-flex;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:600;background:#fef3c7;color:#92400e;}
.est-pend{display:inline-flex;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:600;background:#fee2e2;color:#991b1b;}
.lab-info-bar{background:#eff6ff;border:1.5px solid #bfdbfe;border-radius:8px;padding:9px 13px;font-size:12px;color:#1e3a5f;display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.lab-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--texto-suave);margin-top:10px;padding-top:10px;border-top:1px solid var(--borde);}

/* ===== EVALUACIONES BD MATRICIAL ===== */
.ev-tabs{display:flex;gap:4px;margin-bottom:16px;background:#fff;border:1.5px solid var(--borde);border-radius:10px;padding:4px;}
.ev-tab{flex:1;padding:8px 14px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--texto-suave);background:transparent;border:none;cursor:pointer;transition:.15s;text-align:center;}
.ev-tab.active{background:var(--verde);color:#fff;box-shadow:0 2px 8px rgba(115,188,37,.3);}
.ev-tab:hover:not(.active){background:#f0f4ec;color:var(--texto);}
.ev-mat-scroll{overflow-x:auto;border-radius:10px;border:1.5px solid var(--borde);margin-bottom:10px;}
.emt{border-collapse:collapse;font-size:12px;width:100%;min-width:700px;}
.emt thead th{background:#1c3a0f;color:#fff;padding:8px 9px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;position:sticky;top:0;z-index:2;}
.emt th.th-grp{background:#1c3a0f;text-align:center;border-left:2px solid rgba(255,255,255,.25);}
.emt th.th-date{background:#243d15;text-align:center;font-size:10px;color:#A3D300;border-left:1px solid rgba(255,255,255,.1);}
.emt th.th-fix{background:#1c3a0f;text-align:left;}
.emt tbody tr:nth-child(even) td{background:#f7faf4;}
.emt tbody tr:hover td{background:#eef5e4!important;}
.emt td{padding:0;border-bottom:1px solid var(--borde);border-right:1px solid #e4edd9;vertical-align:middle;}
.emt td.fix{padding:7px 9px;font-size:12px;white-space:nowrap;}
.emt td.fix b{display:block;font-size:11px;color:#1c3a0f;}
.ev-cell{min-width:72px;max-width:95px;}
.ev-in{display:flex;align-items:center;justify-content:center;min-height:40px;padding:4px 5px;border-left:1px solid #e4edd9;cursor:pointer;}
.ev-in:hover{background:#d4edab;}
.ev-grp-left .ev-in{border-left:2px solid #73BC25;}
.ev-dir{background:#eef7e2;}
.ev-dir .ev-in:hover{background:#d4edab;}
.ev-form{background:#f0edff;}
.ev-form .ev-in:hover{background:#ddd8ff;}
.ev-val{font-size:12.5px;font-weight:700;color:#1c3a0f;text-align:center;}
.ev-unit{font-size:9px;color:var(--texto-suave);text-align:center;display:block;}
.ev-empty{color:#c8d4c2;font-size:15px;}
.ev-src-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:3px;vertical-align:middle;}
.ev-pending{background:#fffbeb;}
.ev-pending .ev-in:hover{background:#fef3c7;}

</style>
</head>

<!-- ============ LOGIN ============ -->
<div id="login-screen">
  <div class="login-card">

      <div class="logo">CG</div>

      </div>

<div id="app">
  <aside class="sidebar" id="sidebar">
    <div class="side-head">
      <div class="logo">CG</div>
      <div class="brandtxt"><b>SIGEC</b><small>Cengicaña</small></div>
    </div>

      <button class="collapse-btn" onclick="toggleSidebar()"><i class="fa-solid fa-angles-left" id="collapse-icon"></i><span id="collapse-text">Contraer menú</span></button>
    </div>
  </aside>

  <div class="main" id="main">
    <div class="topbar">
      <div class="topbar-left">
        <i class="fa-solid fa-bars burger" onclick="toggleMobileSidebar()"></i>
        <div class="breadcrumb"><i class="fa-solid fa-house" style="font-size:11px;"></i> <span>/</span> <b id="crumb-current">Dashboard</b></div>
      </div>

/* ---------------- PERMISOS ---------------- */
function can(action){
  const rol = session.rol;
  if(rol==='administrador') return true;
  if(rol==='director') return ['view_reports','run_analysis'].includes(action);
  if(rol==='encargado') return ['create_proyecto','edit_proyecto','create_ensayo','edit_ensayo',
    'register_evaluacion','upload_files','run_analysis','write_bitacora','manage_memberships',
    'manage_formularios','create_muestra','view_lab'].includes(action);
  if(rol==='experto') return ['register_evaluacion','upload_files','run_analysis','write_bitacora',
    'view_reports','create_muestra','view_lab'].includes(action);
  if(rol==='investigador') return ['register_evaluacion','upload_files','write_bitacora',
    'create_muestra','view_lab'].includes(action);
  if(rol==='muestreador') return ['ver_formulario_asignado'].includes(action);
  if(rol==='ingenio') return ['view_lab'].includes(action);
  return false;
}
function rolEnProyecto(proyectoId){
  if(session.rol==='administrador'||session.rol==='director') return session.rol;
  const m = MEMBERSHIPS.find(mb=>mb.proyectoId===proyectoId && mb.usuarioId===session.id);
  return m ? m.rol : null;
}
function programasVisibles(){
  if(session.rol==='administrador'||session.rol==='director') return PROGRAMAS.map(p=>p.id);
  return session.programas||[];
}
function proyectosVisibles(){
  if(session.rol==='administrador'||session.rol==='director') return PROYECTOS;
  if(session.rol==='muestreador'){
    const ids=[...new Set(ASIGNACIONES.filter(a=>a.usuarioId===session.id).map(a=>a.proyectoId))];
    return PROYECTOS.filter(p=>ids.includes(p.id));
  }
  const porMembership = MEMBERSHIPS.filter(m=>m.usuarioId===session.id).map(m=>m.proyectoId);
  const porPrograma = (session.programas||[]).length
    ? PROYECTOS.filter(p=>session.programas.includes(p.programaId)).map(p=>p.id)
    : [];
  const ids=[...new Set([...porMembership,...porPrograma])];
  return PROYECTOS.filter(p=>ids.includes(p.id));
}
function ensayosVisibles(){
  if(session.rol==='muestreador'){
    const ids=[...new Set(ASIGNACIONES.filter(a=>a.usuarioId===session.id).map(a=>a.ensayoId))];
    return ENSAYOS.filter(e=>ids.includes(e.id));
  }
  const proyIds = proyectosVisibles().map(p=>p.id);
  if(session.ingenio) return ENSAYOS.filter(e=>proyIds.includes(e.proyectoId)&&e.ingenio===session.ingenio);
  return ENSAYOS.filter(e=>proyIds.includes(e.proyectoId));
}

function canSeeMenu(item){
  if(session.rol==='muestreador') return ['dashboard','formularios'].includes(item.id);
  if(item.permKey==='admin_only') return session.rol==='administrador';
  if(item.permKey==='view_reports_menu') return ['administrador','director','encargado','experto'].includes(session.rol);
  if(item.permKey==='analisis_menu') return can('run_analysis');
  if(item.permKey==='formularios_menu') return can('manage_formularios');
  if(item.permKey==='lab_muestras') return can('create_muestra')||session.rol==='administrador';
  return true;
}

function renderSideNav(){
  const nav = document.getElementById('side-nav');
  nav.innerHTML = NAV.map(sec=>{
    const items = sec.items.filter(canSeeMenu);
    if(!items.length) return '';
    return `<div class="nav-section-title">${sec.section}</div>` + items.map(it=>`
      <a class="nav-item ${currentPage===it.id?'active':''}" onclick="goPage('${it.id}')">
        <i class="fa-solid ${it.icon}"></i><span>${it.label}</span>
      </a>`).join('');
  }).join('');
}

function toggleSidebar(){
  sidebarCollapsed = !sidebarCollapsed;
  document.getElementById('sidebar').classList.toggle('collapsed',sidebarCollapsed);
  document.getElementById('main').classList.toggle('collapsed',sidebarCollapsed);
  document.getElementById('collapse-icon').className = sidebarCollapsed?'fa-solid fa-angles-right':'fa-solid fa-angles-left';
  document.getElementById('collapse-text').textContent = sidebarCollapsed?'':'Contraer menú';
}
function toggleMobileSidebar(){
  document.getElementById('sidebar').classList.toggle('mobile-open');
}

function goPage(id){
  currentPage = id;
  renderSideNav();
  document.getElementById('crumb-current').textContent = labelOf(id);
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  const target = document.getElementById('page-'+id);
  if(target) target.classList.add('active');
  document.getElementById('sidebar').classList.remove('mobile-open');
  if(id==='analisis') populateAnalisisSelectors();
  if(id==='bitacora') renderBitacoraTable();
  if(id==='formularios') renderFormulariosPage();
  if(id==='laboratorio') renderLabTable();
  if(id==='muestras_gen') initMuestrasGen();
  if(id==='muestras_consulta') renderConsultaMuestras();
  if(id==='evaluaciones'){ fillMatrizSelects(); renderEvaluacionesTable(); }
  if(id==='usuarios') renderUsuariosTable();
  if(id==='reportes' && typeof simReport !== 'undefined') {}
}
function labelOf(id){
  for(const sec of NAV){ const it = sec.items.find(i=>i.id===id); if(it) return it.label; }
  return id;
}

/* ===================== DASHBOARD ===================== */
function pageDashboard(){
  const proy = proyectosVisibles();
  const ens = ensayosVisibles();
  const activos = ens.filter(e=>e.estado==='En campo'||e.estado==='Planificado').length;
  const finalizados = ens.filter(e=>e.estado==='Finalizado').length;

  const ingeniosCount = session.rol==='ingenio'?1:INGENIOS.length;
  const investigadores = USUARIOS.filter(u=>u.rol==='investigador'||u.rol==='encargado').length;

  const maxBar = Math.max(...PROGRAMAS.map(p=>ENSAYOS.filter(e=>{
    const pr = PROYECTOS.find(x=>x.id===e.proyectoId); return pr && pr.programaId===p.id;
  }).length),1);

  const barChart = PROGRAMAS.filter(p=>programasVisibles().includes(p.id)).slice(0,7).map(p=>{
    const count = ENSAYOS.filter(e=>{const pr=PROYECTOS.find(x=>x.id===e.proyectoId); return pr && pr.programaId===p.id;}).length;
    const h = Math.max(8,(count/maxBar)*150);
    return `<div class="bar-col"><div class="bar" style="height:${h}px;background:linear-gradient(180deg,${p.color}aa,${p.color})"></div><div class="bar-lbl">${p.nombre.split(' ')[0]}</div></div>`;
  }).join('');

  const estadoCounts = {"En campo":0,"Planificado":0,"Finalizado":0};
  ens.forEach(e=>{ if(estadoCounts[e.estado]!==undefined) estadoCounts[e.estado]++; });
  const totalEstado = Object.values(estadoCounts).reduce((a,b)=>a+b,0)||1;
  const donutColors = {"En campo":"#73BC25","Planificado":"#FFCC00","Finalizado":"#A3D300"};
  let acc=0;
  const gradientParts = Object.entries(estadoCounts).map(([k,v])=>{
    const start = acc/totalEstado*360; acc+=v; const end=acc/totalEstado*360;
    return `${donutColors[k]} ${start}deg ${end}deg`;
  }).join(',');

  const proximas = [
    {fecha:"21 jun",ensayo:"E-AG001-01",variable:"Altura",resp:"Juan Pérez"},
    {fecha:"24 jun",ensayo:"E-RG003-01",variable:"Brix",resp:"María López"},
    {fecha:"28 jun",ensayo:"E-FT002-01",variable:"Severidad roya",resp:"Ana Lucía Pérez"},
    {fecha:"03 jul",ensayo:"E-AG001-02",variable:"Rendimiento",resp:"Juan Pérez"},
  ];

  return `<div class="page" id="page-dashboard">
    <div class="page-header">
      <div><h1>Dashboard general</h1><p>Resumen de la actividad de investigación en tiempo simulado</p></div>
    </div>

    <div class="kpi-grid">
      ${kpi('fa-folder-open',proy.length,'Total de proyectos','#73BC25')}
      ${kpi('fa-seedling',activos,'Ensayos activos','#FF6B00')}
      ${kpi('fa-circle-check',finalizados,'Ensayos finalizados','#A3D300')}
      ${kpi('fa-layer-group',progVisibles,'Programas de investigación','#FFCC00','#a87900')}
      ${kpi('fa-industry',ingeniosCount,'Ingenios participantes','#1f6fbf')}
      ${kpi('fa-user-graduate',investigadores,'Investigadores','#73BC25')}
    </div>

    <div class="grid-2">
      <div class="card">
        <div class="card-head"><h3>Ensayos por programa</h3><span class="muted">Conteo actual</span></div>
        <div class="bar-chart">${barChart || '<div class="empty-state" style="margin:auto;"><i class="fa-solid fa-chart-simple"></i><div>Sin datos visibles</div></div>'}</div>
      </div>
      <div class="card">
        <div class="card-head"><h3>Estado de ensayos</h3></div>
        <div class="donut-wrap">
          <div style="width:120px;height:120px;border-radius:50%;background:conic-gradient(${gradientParts});flex-shrink:0;"></div>
          <div>
            ${Object.entries(estadoCounts).map(([k,v])=>`<div class="legend-item"><span class="legend-dot" style="background:${donutColors[k]}"></span>${k}: <b style="margin-left:4px;">${v}</b></div>`).join('')}
          </div>
        </div>
      </div>
    </div>

    <div class="grid-2">
      <div class="card">
        <div class="card-head"><h3>Próximas evaluaciones</h3><span class="muted">Calendario simulado</span></div>
        <table><thead><tr><th>Fecha</th><th>Ensayo</th><th>Variable</th><th>Responsable</th></tr></thead>
        <tbody>${proximas.map(p=>`<tr><td><b>${p.fecha}</b></td><td>${p.ensayo}</td><td>${p.variable}</td><td>${p.resp}</td></tr>`).join('')}</tbody></table>
      </div>
      <div class="card">
        <div class="card-head"><h3>Actividad reciente</h3></div>
        <div class="activity-list">
          ${ACTIVIDAD_RECIENTE.map(a=>`
            <div class="act-item">
              <div class="act-icon" style="background:${a.color}"><i class="fa-solid ${a.icon}"></i></div>
              <div class="act-text"><b>${a.titulo}</b><p>${a.detalle}</p></div>
              <div class="act-time">${a.tiempo}</div>
            </div>`).join('')}
        </div>
      </div>
    </div>

}

    <div class="form-row" style="font-size:12.5px;gap:18px;">
      <div><b>Proyecto:</b><br>${proy?proy.nombre:'—'}</div>
      <div><b>Ingenio:</b><br>${e.ingenio}</div>
      <div><b>Finca / Lote:</b><br>${e.finca} / ${e.lote}</div>
      <div><b>Diseño experimental:</b><br>${e.diseno}</div>
      <div><b>Cultivo / Variedad:</b><br>${e.cultivo} / ${e.variedad}</div>
      <div><b>Responsable:</b><br>${e.responsable}</div>
    </div>
    ${hasGPS?`<div style="margin-top:12px;"><span class="gps-badge"><i class="fa-solid fa-location-dot"></i> GPS registrado: ${e.lat.toFixed(4)}, ${e.lng.toFixed(4)}</span></div>`:'<div style="margin-top:12px;"><span class="gps-badge no-gps"><i class="fa-solid fa-location-crosshairs"></i> Sin coordenadas GPS — edita el ensayo para agregarlas</span></div>'}
    <hr style="margin:16px 0;border:none;border-top:1px solid var(--borde);">
    <div style="display:flex;gap:18px;flex-wrap:wrap;">
      <div class="info-pill"><i class="fa-solid fa-flask"></i> ${trats.length} tratamientos</div>
      <div class="info-pill"><i class="fa-solid fa-border-all"></i> ${parc.length} parcelas</div>
      <div class="info-pill"><i class="fa-solid fa-paperclip"></i> ${archivos.length} archivos</div>
    </div>`;

  /* ---- TAB 1: Estructura (tratamientos + parcelas editable) ---- */
  const tratRows = trats.map(t=>`<tr class="trat-row" data-tid="${t.id}">
    <td><input value="${t.codigo}" onchange="updateTrat(${t.id},'codigo',this.value)" ${canEdit?'':'readonly'}></td>
    <td><input value="${t.descripcion}" onchange="updateTrat(${t.id},'descripcion',this.value)" ${canEdit?'':'readonly'}></td>
    <td><input type="number" min="1" value="${t.unidades}" style="width:70px;" onchange="updateTrat(${t.id},'unidades',parseInt(this.value))" ${canEdit?'':'readonly'}></td>
    ${canEdit?`<td><button class="btn btn-danger btn-sm" onclick="deleteTrat(${t.id},${id})"><i class="fa-solid fa-trash"></i></button></td>`:''}
  </tr>`).join('');

  const parcRows = parc.map(p=>`<tr>
    <td><b>${p.codigo}</b></td>
    <td><span class="tag tag-blue">${p.tratamientoCodigo}</span></td>
    <td>${p.repeticion}</td>
    <td>${p.area ? p.area+' m²' : '—'}</td>
    <td style="font-size:11px;color:var(--texto-suave);">${p.notas||'—'}</td>
  </tr>`).join('');

  const tab1 = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px;">
      <h3 style="font-size:15px;font-weight:700;"><i class="fa-solid fa-flask" style="color:var(--verde);margin-right:7px;"></i>Tratamientos</h3>
      ${canEdit?`<div style="display:flex;gap:8px;">
        <button class="btn btn-secondary btn-sm" onclick="addTratRow(${id})"><i class="fa-solid fa-plus"></i> Agregar tratamiento</button>
        <button class="btn btn-primary btn-sm" onclick="generarParcelasAuto(${id})"><i class="fa-solid fa-border-all"></i> Generar parcelas</button>
      </div>`:''}
    </div>
    <div class="struct-table-wrap">
    <table><thead><tr><th>Código</th><th>Descripción / Factor evaluado</th><th>Unidades (reps)</th>${canEdit?'<th></th>':''}</tr></thead>
    <tbody id="trat-tbody-${id}">${tratRows||`<tr><td colspan="${canEdit?4:3}" style="color:var(--texto-suave);font-size:12px;padding:14px;">Sin tratamientos — agrega el primero</td></tr>`}</tbody></table>
    </div>
    <hr style="margin:18px 0;border:none;border-top:1px solid var(--borde);">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:10px;">
      <h3 style="font-size:15px;font-weight:700;"><i class="fa-solid fa-border-all" style="color:var(--verde);margin-right:7px;"></i>Parcelas</h3>
      ${canEdit?`<button class="btn btn-secondary btn-sm" onclick="openParcelajeModal(${id})"><i class="fa-solid fa-sliders"></i> Configurar parcelas</button>`:''}
    </div>
    <div class="struct-table-wrap">
    <table><thead><tr><th>Código</th><th>Tratamiento</th><th>Repetición</th><th>Área</th><th>Notas</th></tr></thead>
    <tbody id="parc-tbody-${id}">${parcRows||`<tr><td colspan="5" style="color:var(--texto-suave);font-size:12px;padding:14px;">Sin parcelas — usa "Generar parcelas" o "Configurar parcelas"</td></tr>`}</tbody></table>
    </div>`;

  /* ---- TAB 2: Mapa GPS ---- */
  const tab2 = hasGPS ? `
    <div class="map-controls">
      <span class="gps-badge"><i class="fa-solid fa-location-dot"></i>${e.lat.toFixed(5)}, ${e.lng.toFixed(5)}</span>
      <a href="https://www.google.com/maps/dir/?api=1&destination=${e.lat},${e.lng}" target="_blank" class="btn btn-secondary btn-sm"><i class="fa-solid fa-route"></i> Navegar con Maps</a>
      <span style="font-size:12px;color:var(--texto-suave);">${parc.length} parcelas mapeadas</span>
    </div>
    <div class="map-wrap" id="map-${id}"></div>
    <p style="font-size:11.5px;color:var(--texto-suave);margin-top:8px;"><i class="fa-solid fa-circle-info" style="margin-right:5px;"></i>En campo: abre el botón "Navegar" para ir al ensayo con GPS. Los marcadores representan el centroide de cada parcela.</p>` :
    `<div class="empty-state"><i class="fa-solid fa-location-crosshairs"></i><div style="margin-top:8px;">Este ensayo no tiene coordenadas GPS registradas.</div>
    ${canEdit?`<button class="btn btn-primary" style="margin-top:14px;" onclick="closeModal();openEnsayoModal(${id})"><i class="fa-solid fa-pen"></i> Editar ensayo y agregar GPS</button>`:''}
    </div>`;

  /* ---- TAB 3: NDVI ---- */
  const ndviColors = {'T1':'#73BC25','T2':'#1f6fbf','T3':'#FF6B00','T4':'#FFCC00','T5':'#A3D300','T6':'#c4471b'};
  let tab3 = '';
  if(ndviSeries.length){
    const allFechas = [...new Set(ndviSeries.flatMap(s=>s.registros.map(r=>r.fecha)))].sort();
    const svgW=420, svgH=160, padL=40, padB=30, padT=10, padR=10;
    const w=svgW-padL-padR, h=svgH-padT-padB;
    const xScale=i=>(i/(allFechas.length-1||1))*w+padL;
    const yScale=v=>(1-v)*h+padT;
    const gridLines = [0,0.25,0.5,0.75,1.0].map(v=>`<line x1="${padL}" x2="${svgW-padR}" y1="${yScale(v).toFixed(1)}" y2="${yScale(v).toFixed(1)}" stroke="#e3e7e1" stroke-width="0.8"/><text x="${padL-4}" y="${(yScale(v)+4).toFixed(1)}" text-anchor="end" font-size="9" fill="#8a9a80">${v.toFixed(2)}</text>`).join('');
    const xLabels = allFechas.map((f,i)=>`<text x="${xScale(i).toFixed(1)}" y="${svgH-6}" text-anchor="middle" font-size="9" fill="#8a9a80">${f}</text>`).join('');
    const paths = ndviSeries.map(s=>{
      const col = ndviColors[s.tratCodigo]||'#888';
      const pts = s.registros.map(r=>{ const fi=allFechas.indexOf(r.fecha); return `${xScale(fi).toFixed(1)},${yScale(r.valor).toFixed(1)}`; });
      const dots = s.registros.map(r=>{ const fi=allFechas.indexOf(r.fecha); return `<circle cx="${xScale(fi).toFixed(1)}" cy="${yScale(r.valor).toFixed(1)}" r="4" fill="${col}" stroke="#fff" stroke-width="1.5"><title>${s.tratCodigo}: ${r.valor} (${r.fecha})</title></circle>`; }).join('');
      return `<polyline points="${pts.join(' ')}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>${dots}`;
    }).join('');
    const legend = ndviSeries.map(s=>`<span style="display:inline-flex;align-items:center;gap:5px;font-size:11.5px;margin-right:12px;"><span style="width:12px;height:12px;border-radius:3px;background:${ndviColors[s.tratCodigo]||'#888'};display:inline-block;"></span>${s.tratCodigo}</span>`).join('');
    const lastVals = ndviSeries.map(s=>{
      const last = s.registros[s.registros.length-1];
      const ndviClass = last.valor>0.8?'tag-green':last.valor>0.6?'tag-yellow':'tag-orange';
      return `<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--borde);"><span style="width:10px;height:10px;border-radius:2px;background:${ndviColors[s.tratCodigo]||'#888'};flex-shrink:0;"></span><span style="font-size:12.5px;flex:1;">${s.tratCodigo}</span><span class="tag ${ndviClass}">${last.valor.toFixed(2)}</span><span style="font-size:11px;color:var(--texto-suave);">${last.fecha}</span></div>`;
    }).join('');
    tab3 = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px;">
        <div>${legend}</div>
        ${canEdit?`<button class="btn btn-secondary btn-sm" onclick="openNdviModal(${id})"><i class="fa-solid fa-plus"></i> Registrar NDVI</button>`:''}
      </div>
      <div style="background:#f9fbf7;border-radius:10px;padding:14px;">
        <svg width="100%" viewBox="0 0 ${svgW} ${svgH}" style="overflow:visible;">${gridLines}${xLabels}${paths}</svg>
      </div>
      <div style="margin-top:14px;"><b style="font-size:13px;display:block;margin-bottom:8px;">Últimos valores por tratamiento</b>${lastVals}</div>
      <p style="font-size:11.5px;color:var(--texto-suave);margin-top:10px;"><i class="fa-solid fa-circle-info" style="margin-right:5px;"></i>NDVI: 0.0–0.3 = suelo/planta débil · 0.3–0.6 = vegetación moderada · 0.6–1.0 = vegetación densa y saludable.</p>`;
  } else {
    tab3 = `<div class="empty-state"><i class="fa-solid fa-satellite"></i><div style="margin-top:8px;">Sin datos NDVI para este ensayo.</div>
      ${canEdit?`<button class="btn btn-primary" style="margin-top:14px;" onclick="openNdviModal(${id})"><i class="fa-solid fa-plus"></i> Registrar primer valor NDVI</button>`:''}
    </div>`;
  }

  /* ---- TAB 4: Clima ---- */
  let tab4 = '';
  if(clima){
    const rainBars = clima.lluvia.map(m=>{
      const maxMM = Math.max(...clima.lluvia.map(x=>x.mm),1);
      const h = Math.max(4, (m.mm/maxMM)*80);
      return `<div class="rain-col"><div class="rain-bar" style="height:${h}px;"></div><div class="rain-lbl">${m.mes}</div><div class="rain-lbl" style="font-weight:600;">${m.mm}</div></div>`;
    }).join('');
    const alertHtml = clima.alertas.map(a=>`<div style="display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px solid var(--borde);font-size:12.5px;"><i class="fa-solid fa-triangle-exclamation" style="color:var(--naranja);margin-top:1px;flex-shrink:0;"></i>${a}</div>`).join('');
    tab4 = `
      <div style="font-size:12px;color:var(--texto-suave);margin-bottom:14px;"><i class="fa-solid fa-location-dot" style="margin-right:5px;"></i>${clima.nombre} · Datos simulados vía API NASA POWER</div>
      <div class="clima-grid">
        <div class="clima-box"><div class="ci">🌡️</div><div class="cv">${clima.temp}°C</div><div class="cl">Temp. promedio</div></div>
        <div class="clima-box"><div class="ci">💧</div><div class="cv">${clima.hr}%</div><div class="cl">Humedad relativa</div></div>
        <div class="clima-box"><div class="ci">💨</div><div class="cv">${clima.viento} km/h</div><div class="cl">Viento</div></div>
        <div class="clima-box"><div class="ci">🌿</div><div class="cv">${clima.eto} mm/d</div><div class="cl">ETo (Penman)</div></div>
      </div>
      <b style="font-size:13px;display:block;margin-bottom:4px;">Lluvia acumulada mensual (mm)</b>
      <div style="background:#f9fbf7;border-radius:10px;padding:14px 10px;">
        <div class="rain-bar-wrap">${rainBars}</div>
      </div>
      ${alertHtml?`<div style="margin-top:14px;"><b style="font-size:13px;">Alertas climáticas</b>${alertHtml}</div>`:''}
      <p style="font-size:11.5px;color:var(--texto-suave);margin-top:12px;"><i class="fa-solid fa-circle-info" style="margin-right:5px;"></i>En producción: datos diarios desde NASA POWER o Open-Meteo usando las coordenadas GPS del ensayo.</p>`;
  } else {
    tab4 = `<div class="empty-state"><i class="fa-solid fa-cloud-sun"></i><div style="margin-top:8px;">Datos climáticos no disponibles para este ensayo.<br>Registra las coordenadas GPS para activar la consulta automática.</div></div>`;
  }

  /* ---- TAB 5: Archivos ---- */
  const carpetas = [...new Set(archivos.map(a=>a.carpeta||'General'))];
  const iconMap = {PDF:'fa-file-pdf',Excel:'fa-file-excel',Word:'fa-file-word',Imagen:'fa-file-image',ZIP:'fa-file-zipper'};
  const fileTree = carpetas.map(c=>{
    const files = archivos.filter(a=>(a.carpeta||'General')===c);
    return `<div class="file-folder">
      <div class="file-folder-head"><i class="fa-solid fa-folder-open fold-icon"></i><span>${c}</span><span class="tag tag-gray" style="margin-left:auto;">${files.length}</span></div>
      <div class="file-folder-body">${files.map(f=>`
        <div class="file-item">
          <i class="fa-solid ${iconMap[f.tipo]||'fa-file'}" style="color:var(--naranja);"></i>
          <div class="fi-name">${f.nombre}</div>
          <div class="fi-meta">${f.tamano} · ${f.fecha}</div>
          <div class="btn-icon" onclick="showToast('success','Descarga simulada','${f.nombre}')"><i class="fa-solid fa-download"></i></div>
          ${session.rol==='administrador'?`<div class="btn-icon" onclick="deleteArchivo(${f.id})"><i class="fa-solid fa-trash"></i></div>`:''}
        </div>`).join('')}
      </div>
    </div>`;
  }).join('');

  const tab5 = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px;">
      <span style="font-size:13px;color:var(--texto-suave);">${archivos.length} archivo${archivos.length!==1?'s':''} · acceso restringido a este proyecto</span>
      ${can('upload_files')?`<button class="btn btn-primary btn-sm" onclick="openArchivoEnsayoModal(${id},${e.proyectoId})"><i class="fa-solid fa-upload"></i> Adjuntar archivo</button>`:''}
    </div>
    <div class="file-tree">${fileTree||emptyState('fa-paperclip','Sin archivos adjuntos en este ensayo')}</div>`;

  /* ---- TAB 6: Bitácora del ensayo ---- */
  const tab6 = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px;">
      <span style="font-size:13px;color:var(--texto-suave);">${bitEntradas.length} entrada${bitEntradas.length!==1?'s':''} registradas</span>
      ${can('write_bitacora')?`<button class="btn btn-primary btn-sm" onclick="openBitacoraModal();"><i class="fa-solid fa-plus"></i> Nueva entrada</button>`:''}
    </div>
    ${bitEntradas.length?`
    <div class="bitacora-timeline">
      ${bitEntradas.map(b=>`
        <div class="bit-entry">
          <div class="bit-dot" style="background:${dotColorForTipo(b.tipo)};box-shadow:0 0 0 2px ${dotColorForTipo(b.tipo)};"></div>
          <div class="bit-card">
            <div class="bit-head">
              <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                <span class="bit-tipo ${tipoBitacoraClass(b.tipo)}">${b.tipo}</span>
                <b style="font-size:13px;">${b.fecha}</b>
              </div>
              ${can('write_bitacora')?`<div style="display:flex;gap:6px;">
                <div class="btn-icon" onclick="openBitacoraModal(${b.id})"><i class="fa-solid fa-pen"></i></div>
                ${session.rol==='administrador'?`<div class="btn-icon" onclick="deleteBitacora(${b.id})"><i class="fa-solid fa-trash"></i></div>`:''}
              </div>`:''}
            </div>
            <div class="bit-desc">${b.descripcion}</div>
            <div class="bit-meta"><span><i class="fa-solid fa-user" style="margin-right:4px;"></i>${b.responsable}</span></div>
          </div>
        </div>`).join('')}
    </div>`:emptyState('fa-book-open','Sin entradas en la bitácora para este ensayo')}`;

  /* ---- Assemble modal ---- */
  const bodyHtml = `
    <div class="tab-bar">${tabBar}</div>
    <div id="etab-panel-0" class="tab-panel active">${tab0}</div>
    <div id="etab-panel-1" class="tab-panel">${tab1}</div>
    <div id="etab-panel-2" class="tab-panel">${tab2}</div>
    <div id="etab-panel-3" class="tab-panel">${tab3}</div>
    <div id="etab-panel-4" class="tab-panel">${tab4}</div>
    <div id="etab-panel-5" class="tab-panel">${tab5}</div>
    <div id="etab-panel-6" class="tab-panel">${tab6}</div>`;

  openModal('Ensayo: '+e.codigo, bodyHtml, null, true);

  // init map after modal open
  if(hasGPS){
    setTimeout(()=>{
      const mapDiv = document.getElementById('map-'+id);
      if(!mapDiv || mapDiv._leaflet_id) return;
      const map = L.map('map-'+id).setView([e.lat,e.lng],15);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);
      // centroid marker
      const mainIcon = L.divIcon({html:`<div style="background:var(--verde,#73BC25);width:16px;height:16px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3);"></div>`,iconAnchor:[8,8],className:''});
      L.marker([e.lat,e.lng],{icon:mainIcon}).addTo(map).bindPopup(`<div class="parcela-popup"><b>${e.codigo}</b><span>${e.finca} / ${e.lote}</span></div>`).openPopup();
      // simulated parcel markers
      parc.forEach((p,i)=>{
        const angle=(i/(parc.length||1))*2*Math.PI;
        const offset=0.0006;
        const plat=e.lat+Math.cos(angle)*offset, plng=e.lng+Math.sin(angle)*offset;
        const pIcon=L.divIcon({html:`<div style="background:#FF6B00;color:#fff;font-size:9px;font-weight:700;width:22px;height:22px;border-radius:4px;border:2px solid #fff;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.3);">${p.codigo.replace('P-','')}</div>`,iconAnchor:[11,11],className:''});
        L.marker([plat,plng],{icon:pIcon}).addTo(map).bindPopup(`<div class="parcela-popup"><b>${p.codigo}</b><span>${p.tratamientoCodigo} · Rep. ${p.repeticion}</span></div>`);
      });
    },200);
  }
}
function openEnsayoModal(id){
  if(id && !can('edit_ensayo')){ showToast('error','Acceso denegado','No tienes permisos para editar ensayos.'); return; }
  if(!id && !can('create_ensayo')){ showToast('error','Acceso denegado','No tienes permisos para crear ensayos.'); return; }
  const edit = ENSAYOS.find(e=>e.id===id);
  const proyDisponibles = proyectosVisibles();
  openModal(edit?'Editar ensayo':'Nuevo ensayo', `
    <div class="form-row">
      <div class="form-group"><label>Código del ensayo</label><input id="f-en-codigo" value="${edit?edit.codigo:''}" placeholder="Ej. E-AG001-03"></div>
      <div class="form-group"><label>Proyecto</label><select id="f-en-proy">${proyDisponibles.map(p=>`<option value="${p.id}" ${edit&&edit.proyectoId===p.id?'selected':''}>${p.codigo} — ${p.nombre}</option>`).join('')}</select></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Ingenio</label><select id="f-en-ingenio">${INGENIOS.map(i=>`<option ${edit&&edit.ingenio===i?'selected':''}>${i}</option>`).join('')}</select></div>
      <div class="form-group"><label>Finca</label><input id="f-en-finca" value="${edit?edit.finca:''}"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Lote</label><input id="f-en-lote" value="${edit?edit.lote:''}"></div>
      <div class="form-group"><label>Diseño experimental</label><select id="f-en-diseno">
        ${['Bloques al azar','Parcelas divididas','Cuadro latino','Completamente al azar'].map(d=>`<option ${edit&&edit.diseno===d?'selected':''}>${d}</option>`).join('')}
      </select></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Cultivo</label><input id="f-en-cultivo" value="${edit?edit.cultivo:'Caña de azúcar'}"></div>
      <div class="form-group"><label>Variedad</label><input id="f-en-variedad" value="${edit?edit.variedad:''}"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Responsable</label><input id="f-en-resp" value="${edit?edit.responsable:session.nombre}"></div>
      <div class="form-group"><label>Estado</label><select id="f-en-estado">
        ${['Planificado','En campo','Finalizado'].map(s=>`<option ${edit&&edit.estado===s?'selected':''}>${s}</option>`).join('')}
      </select></div>
    </div>
    <hr style="margin:12px 0;border:none;border-top:1px solid var(--borde);">
    <p style="font-size:12px;font-weight:600;color:var(--texto-suave);margin-bottom:10px;"><i class="fa-solid fa-location-dot" style="margin-right:5px;color:var(--verde);"></i>Coordenadas GPS del lote (opcional — habilita mapa y datos climáticos)</p>
    <div class="form-row">
      <div class="form-group"><label>Latitud</label><input type="number" step="0.00001" id="f-en-lat" value="${edit&&edit.lat?edit.lat:''}" placeholder="Ej. 14.5892"></div>
      <div class="form-group"><label>Longitud</label><input type="number" step="0.00001" id="f-en-lng" value="${edit&&edit.lng?edit.lng:''}" placeholder="Ej. -91.5143"></div>
    </div>

/* ── helpers ── */
function evGetFiltros(){
  return {
    ensayoId: parseInt(document.getElementById('ev-f-ens')?.value||0)||null,
    cat: document.getElementById('ev-f-cat')?.value||'',
    varId: parseInt(document.getElementById('ev-f-var')?.value||0)||null,
  };
}

function evGetVariables(){
  const {cat,varId}=evGetFiltros();
  let vars=VARIABLES.filter(v=>!cat||v.categoria===cat);
  if(varId) vars=vars.filter(v=>v.id===varId);
  return vars;
}

// Devuelve todas las fechas únicas con datos para un ensayo + variables
function evGetFechas(ensayoId, varIds){
  const dates=new Set();
  const parcIds=PARCELAS.filter(p=>p.ensayoId===ensayoId).map(p=>p.id);
  EVALUACIONES.filter(e=>parcIds.includes(e.parcelaId)&&varIds.includes(e.variableId)).forEach(e=>dates.add(e.fecha));
  // También de respuestas de formularios ya promovidas o con variables mapeadas
  RESPUESTAS.filter(r=>r.ensayoId===ensayoId).forEach(r=>{
    Object.keys(r.valores).forEach(campo=>{
      if(CAMPO_A_VARIABLE[campo]) dates.add(r.fecha);
    });
  });
  return [...dates].sort();
}

// Busca valor en EVALUACIONES directas
function evGetDirecto(parcelaId,varId,fecha){
  return EVALUACIONES.find(e=>e.parcelaId===parcelaId&&e.variableId===varId&&e.fecha===fecha)||null;
}

// Busca valor en RESPUESTAS de formulario
function evGetFormulario(ensayoId,parcelaCodigo,varNombre,fecha){
  for(const r of RESPUESTAS){
    if(r.ensayoId!==ensayoId||r.parcelaCodigo!==parcelaCodigo||r.fecha!==fecha) continue;
    for(const [campo,varN] of Object.entries(CAMPO_A_VARIABLE)){
      if(varN===varNombre && r.valores[campo]!==undefined && typeof r.valores[campo]==='number'){
        return {valor:r.valores[campo], respId:r.id, responsable:r.responsable, promovido:r.promovido};
      }
    }
  }
  return null;
}

  const vars=evGetVariables();
  const varIds=vars.map(v=>v.id);

  const ens=ENSAYOS.find(e=>e.id===ensayoId);
  const proy=PROYECTOS.find(p=>p.id===ens?.proyectoId);

  if(!parcelas.length){
    cont.innerHTML=`<div style="text-align:center;padding:40px;color:var(--texto-suave);">Sin parcelas definidas en este ensayo.</div>`;

  // Cabecera: parcela cols (fijas) + Variable × Fecha

  const fixCols=['Parcela','Trat.','Rep.'];
  fixCols.forEach(c=>h+=`<th class="th-fix" rowspan="2">${c}</th>`);
  vars.forEach((v,vi)=>{
    h+=`<th class="th-grp" colspan="${Math.max(fechas.length,1)}" style="${vi===0?'border-left:2px solid rgba(255,255,255,.3);':''}">${v.nombre} <span style="font-weight:400;font-size:9px;opacity:.7;">(${v.unidad})</span></th>`;
  });
  h+=`<th class="th-fix" rowspan="2"></th></tr><tr>`;
  vars.forEach((v,vi)=>{
    if(!fechas.length){ h+=`<th class="th-date" style="${vi===0?'border-left:2px solid rgba(255,255,255,.25);':''}">—</th>`; }
    else fechas.forEach((f,fi)=>{
      const bl=(fi===0&&vi===0)?'border-left:2px solid rgba(255,255,255,.25);':(fi===0?'border-left:2px solid rgba(255,255,255,.15);':'');
      h+=`<th class="th-date" style="${bl}">${f.slice(5)}</th>`;
    });
  });
  h+=`</tr></thead><tbody>`;

  let tc=0,cv=0,cf=0;
  let prevTrat='';
  parcelas.forEach(parc=>{
    const isNewTrat=parc.tratamientoCodigo!==prevTrat; prevTrat=parc.tratamientoCodigo;
    h+=`<tr style="${isNewTrat?'border-top:2px solid #73BC25;':''}">`;
    h+=`<td class="fix"><b>${parc.codigo}</b></td>`;
    h+=`<td class="fix" style="text-align:center;"><span style="background:#e8f5d1;color:#3a6b10;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:700;">${parc.tratamientoCodigo}</span></td>`;
    h+=`<td class="fix" style="text-align:center;font-size:11px;">Rep.${parc.repeticion}</td>`;
    vars.forEach((v,vi)=>{
      const grpCls=vi===0?'ev-grp-left':'';

        h+=`<td class="ev-cell ${grpCls}"><div class="ev-in"><span class="ev-empty">+</span></div></td>`;
      } else {
        fechas.forEach((fecha,fi)=>{
          tc++;
          const dir=evGetDirecto(parc.id,v.id,fecha);
          const frm=!dir?evGetFormulario(ensayoId,parc.codigo,v.nombre,fecha):null;
          const bl=(fi===0&&vi===0)?'ev-grp-left':'';

              <div><div class="ev-val">${dir.valor}</div><span class="ev-unit">${v.unidad}</span></div>

  });
  h+=`</tbody></table></div>`;

  // Botón nueva fecha de muestreo
  h+=`<div style="margin-top:10px;display:flex;align-items:center;gap:10px;">
    <button style="padding:6px 14px;border-radius:8px;background:transparent;border:1.5px dashed var(--verde);color:var(--verde);font-size:12px;font-weight:600;cursor:pointer;" onclick="evAddFecha(${ensayoId})">
      <i class="fa-solid fa-calendar-plus"></i> Nueva fecha de muestreo
    </button>
    <button style="padding:6px 14px;border-radius:8px;background:transparent;border:1.5px dashed #7B2FBE;color:#7B2FBE;font-size:12px;font-weight:600;cursor:pointer;" onclick="evPromoverTodos(${ensayoId})">
      <i class="fa-solid fa-arrow-up-from-bracket"></i> Promover todos los formularios pendientes
    </button>
  </div>`;

  const pct=tc>0?Math.round((cv+cf)/tc*100):0;
  if(info) info.innerHTML=`<i class="fa-solid fa-circle-info"></i>
    <span><b>${proy?proy.codigo+' · ':''} ${ens?ens.codigo:''}</b> &nbsp;·&nbsp;
    ${parcelas.length} parcelas · ${vars.length} variable${vars.length!==1?'s':''} · ${fechas.length} fecha${fechas.length!==1?'s':''} de muestreo &nbsp;·&nbsp;
    <b style="color:#3a6b10;">${cv} directas</b> + <b style="color:#5a1f9b;">${cf} de formularios</b> = <b>${Math.round((cv+cf))} / ${tc} celdas (${pct}%)</b></span>`;
  cont.innerHTML=h;
}

let _evFechasExtra={};
function evAddFecha(ensayoId){
  openModal('Nueva fecha de muestreo',`
    <p style="font-size:12px;color:var(--texto-suave);margin-bottom:14px;">La fecha aparecerá como columna en la BD matricial. Luego puedes ingresar cada valor celda por celda.</p>
    <div class="form-group"><label>Fecha</label><input type="date" id="nf-f" value="${new Date().toISOString().slice(0,10)}"></div>`,()=>{
    const f=val('nf-f'); if(!f){showToast('error','Fecha requerida','');return false;}
    if(!_evFechasExtra[ensayoId]) _evFechasExtra[ensayoId]=[];
    if(!_evFechasExtra[ensayoId].includes(f)) _evFechasExtra[ensayoId].push(f);
    showToast('success','Fecha agregada',f);
    evRenderTab(); return true;
  });
}

function evGetFechas(ensayoId,varIds){
  const dates=new Set();
  const parcIds=PARCELAS.filter(p=>p.ensayoId===ensayoId).map(p=>p.id);
  EVALUACIONES.filter(e=>parcIds.includes(e.parcelaId)&&varIds.includes(e.variableId)).forEach(e=>dates.add(e.fecha));
  RESPUESTAS.filter(r=>r.ensayoId===ensayoId).forEach(r=>{
    Object.keys(r.valores).forEach(campo=>{if(CAMPO_A_VARIABLE[campo]) dates.add(r.fecha);});
  });
  if(_evFechasExtra[ensayoId]) _evFechasExtra[ensayoId].forEach(f=>dates.add(f));
  return [...dates].sort();
}

            <b>${ens?.codigo||'—'}</b> · Parcela: <b>${r.parcelaCodigo}</b> · ${r.fecha} · ${r.responsable}

        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          <span class="tag ${badgeCls}">${badgeTxt}</span>

        </div>

      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;">
        ${vars.map(([campo,valor])=>`<div style="background:${r.promovido?'#e8f5d1':'#f0edff'};border-radius:8px;padding:8px 11px;">

          <div style="font-size:13px;font-weight:700;color:${r.promovido?'#3a6b10':'#5a1f9b'};">${valor}</div>
          <div style="font-size:10px;color:var(--texto-suave);">→ Variable: <b>${CAMPO_A_VARIABLE[campo]}</b></div>
        </div>`).join('')}
        ${noMaped.map(([campo,valor])=>`<div style="background:#f5f5f5;border-radius:8px;padding:8px 11px;opacity:.7;">
          <div style="font-size:10.5px;color:var(--texto-suave);margin-bottom:3px;">${campo}</div>
          <div style="font-size:12px;color:var(--texto);">${valor}</div>
          <div style="font-size:10px;color:#bbb;">Sin mapeo a variable</div>
        </div>`).join('')}
      </div>
    </div>`;
  }).join('');

function evPromoverRespuesta(respId){
  const resp=RESPUESTAS.find(r=>r.id===respId);
  if(!resp||resp.promovido){showToast('info','Ya promovido','');return;}
  const parcela=PARCELAS.find(p=>p.ensayoId===resp.ensayoId&&p.codigo===resp.parcelaCodigo);
  if(!parcela){showToast('error','Parcela no encontrada',`${resp.parcelaCodigo} no existe en el ensayo.`);return;}
  let count=0;
  Object.entries(resp.valores).forEach(([campo,valor])=>{
    const varNombre=CAMPO_A_VARIABLE[campo];
    if(!varNombre||typeof valor!=='number') return;
    const v=VARIABLES.find(x=>x.nombre===varNombre);
    if(!v) return;
    const yaExiste=EVALUACIONES.find(e=>e.parcelaId===parcela.id&&e.variableId===v.id&&e.fecha===resp.fecha);
    if(yaExiste) return;
    EVALUACIONES.push({id:nextId(EVALUACIONES),fecha:resp.fecha,variableId:v.id,parcelaId:parcela.id,valor,obs:'Promovido desde formulario de campo',responsable:resp.responsable,fuente:'formulario',respuestaId:resp.id});
    count++;
  });
  resp.promovido=true;
  showToast('success','Promovido',`${count} variable${count!==1?'s':''} trasladada${count!==1?'s':''} a Evaluaciones`);
  evRenderTab();
}

function evPromoverTodos(ensayoId){
  const pendientes=RESPUESTAS.filter(r=>r.ensayoId===ensayoId&&!r.promovido);
  if(!pendientes.length){showToast('info','Sin pendientes','Todos los formularios ya fueron promovidos.');return;}
  let total=0;
  pendientes.forEach(r=>{
    const parcela=PARCELAS.find(p=>p.ensayoId===r.ensayoId&&p.codigo===r.parcelaCodigo);
    if(!parcela) return;
    Object.entries(r.valores).forEach(([campo,valor])=>{
      const varNombre=CAMPO_A_VARIABLE[campo];
      if(!varNombre||typeof valor!=='number') return;
      const v=VARIABLES.find(x=>x.nombre===varNombre);
      if(!v) return;
      const yaExiste=EVALUACIONES.find(e=>e.parcelaId===parcela.id&&e.variableId===v.id&&e.fecha===r.fecha);
      if(yaExiste) return;
      EVALUACIONES.push({id:nextId(EVALUACIONES),fecha:r.fecha,variableId:v.id,parcelaId:parcela.id,valor,obs:'Promovido desde formulario',responsable:r.responsable,fuente:'formulario',respuestaId:r.id});
      total++;
    });
    r.promovido=true;
  });
  showToast('success','Promoción masiva completa',`${total} evaluaciones agregadas desde ${pendientes.length} formularios`);
  evRenderTab();
}

  const visEns=ensayosVisibles().map(e=>e.id);
  const visParcIds=PARCELAS.filter(p=>visEns.includes(p.ensayoId)).map(p=>p.id);
  let rows=EVALUACIONES.filter(ev=>visParcIds.includes(ev.parcelaId));
  if(ensayoId) rows=rows.filter(ev=>{const p=PARCELAS.find(x=>x.id===ev.parcelaId);return p?.ensayoId===ensayoId;});

      <td style="padding:8px 11px;font-size:11.5px;text-align:center;">Rep.${p?p.repeticion:'—'}</td>

      <td style="padding:8px 11px;font-size:12px;">${v?v.nombre:'—'}</td>

      <td style="padding:8px 11px;font-size:11.5px;">${ev.responsable}</td>

    </tr>`;
