/* ── Exportar ── */
function evExportExcel(){
  const {ensayoId,cat,varId}=evGetFiltros();
  const visEns=ensayosVisibles().map(e=>e.id);
  const visParcIds=PARCELAS.filter(p=>visEns.includes(p.ensayoId)).map(p=>p.id);
  let rows=EVALUACIONES.filter(ev=>visParcIds.includes(ev.parcelaId));
  if(ensayoId) rows=rows.filter(ev=>{const p=PARCELAS.find(x=>x.id===ev.parcelaId);return p?.ensayoId===ensayoId;});
  if(cat) rows=rows.filter(ev=>{const v=VARIABLES.find(x=>x.id===ev.variableId);return v?.categoria===cat;});
  if(varId) rows=rows.filter(ev=>ev.variableId===varId);
  if(!rows.length){showToast('warn','Sin datos','');return;}
  const data=rows.map(ev=>{
    const v=VARIABLES.find(x=>x.id===ev.variableId),p=PARCELAS.find(x=>x.id===ev.parcelaId),ens=ENSAYOS.find(e=>e.id===p?.ensayoId),proy=PROYECTOS.find(x=>x.id===ens?.proyectoId);
    return {Fecha:ev.fecha,Proyecto:proy?.codigo||'',Ensayo:ens?.codigo||'',Parcela:p?.codigo||'',Tratamiento:p?.tratamientoCodigo||'',Repeticion:p?.repeticion||'',Categoria:v?.categoria||'',Variable:v?.nombre||'',Unidad:v?.unidad||'',Valor:ev.valor,Fuente:ev.fuente||'directa',Responsable:ev.responsable};
  });
  const ws=XLSX.utils.json_to_sheet(data);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'BD_Evaluaciones');
  XLSX.writeFile(wb,`BD_Evaluaciones_${new Date().toISOString().slice(0,10)}.xlsx`);
  showToast('success','BD exportada',`${rows.length} evaluaciones`);
}

      <div class="form-group"><label>Tratamiento</label><select id="f-ev-trat" onchange="refreshEvalRepeticion()"></select></div>
      <div class="form-group"><label>Repetición / Parcela</label><select id="f-ev-rep"></select></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Categoría</label><select id="f-ev-tipo" onchange="refreshEvalVariables()"><option value="Desarrollo">Desarrollo</option><option value="Cosecha">Cosecha</option></select></div>
      <div class="form-group"><label>Variable</label><select id="f-ev-var"></select></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Fecha</label><input type="date" id="f-ev-fecha" value="${new Date().toISOString().slice(0,10)}"></div>
      <div class="form-group"><label>Valor</label><input type="number" step="0.01" id="f-ev-valor" placeholder="0.00"></div>
    </div>
    <div class="form-group"><label>Observaciones</label><textarea id="f-ev-obs" placeholder="Opcional"></textarea></div>`,()=>{
    const parcelaId=parseInt(val('f-ev-rep')),variableId=parseInt(val('f-ev-var')),fecha=val('f-ev-fecha'),valor=parseFloat(val('f-ev-valor')),obs=val('f-ev-obs');

    EVALUACIONES.push({id:nextId(EVALUACIONES),fecha,variableId,parcelaId,valor,obs,responsable:session.nombre,fuente:'directa'});

    evRenderTab(); return true;
  });

function refreshEvalCascada(){
  const eId=parseInt(val('f-ev-ensayo'));
  const ts=document.getElementById('f-ev-trat'); if(!ts) return;
  ts.innerHTML=TRATAMIENTOS.filter(t=>t.ensayoId===eId).map(t=>`<option value="${t.codigo}">${t.codigo} — ${t.descripcion}</option>`).join('')||'<option>Sin tratamientos</option>';
  refreshEvalRepeticion();
}
function refreshEvalRepeticion(){
  const eId=parseInt(val('f-ev-ensayo')),tc=val('f-ev-trat');
  const rs=document.getElementById('f-ev-rep'); if(!rs) return;
  rs.innerHTML=PARCELAS.filter(p=>p.ensayoId===eId&&p.tratamientoCodigo===tc).map(p=>`<option value="${p.id}">Rep.${p.repeticion} (${p.codigo})</option>`).join('')||'<option>Sin parcelas</option>';
}
function refreshEvalVariables(){
  const cat=val('f-ev-tipo'),vs=document.getElementById('f-ev-var'); if(!vs) return;
  vs.innerHTML=VARIABLES.filter(v=>v.categoria===cat).map(v=>`<option value="${v.id}">${v.nombre} (${v.unidad})</option>`).join('');
}

function generarIdMuestra(proyectoId, ensayoId, tipo, seq){
  const proy = PROYECTOS.find(p=>p.id===proyectoId);
  const ens  = ENSAYOS.find(e=>e.id===ensayoId);
  const progCod = proy?(PROGRAMAS.find(pr=>pr.id===proy.programaId)?.codigo||'XX').replace('P-',''):'XX';
  const ensCod  = ens?ens.codigo.split('-')[1]||'E000':'E000';
  const tipoCod = {Suelo:'SU','Tejido vegetal':'TV',Agua:'AG',Jugos:'JU',Mieles:'MI',Fertilizantes:'FE'}[tipo]||'OT';
  const yr = new Date().getFullYear().toString().slice(2);
  return `SIGEC-${progCod}-${ensCod}-${tipoCod}-${String(seq).padStart(3,'0')}-${yr}`;
}

function switchLabTab(tab){
  _labTab=tab;
  document.getElementById('ltab-mat').classList.toggle('active',tab==='matriz');
  document.getElementById('ltab-lst').classList.toggle('active',tab==='listado');
  document.getElementById('lab-view-mat').style.display=tab==='matriz'?'':'none';
  document.getElementById('lab-view-lst').style.display=tab==='listado'?'':'none';
  labRenderTab();
}

function labGetRows(){
  const fP=parseInt(document.getElementById('lab-f-proy')?.value)||null;
  const fE=parseInt(document.getElementById('lab-f-ens')?.value)||null;
  const fT=document.getElementById('lab-f-tipo')?.value||'';
  const fS=document.getElementById('lab-f-est')?.value||'';
  const vp=proyectosVisibles().map(p=>p.id);
  let r=MUESTRAS_LAB.filter(m=>vp.includes(m.proyectoId));
  if(fP) r=r.filter(m=>m.proyectoId===fP);
  if(fE) r=r.filter(m=>m.ensayoId===fE);
  if(fT) r=r.filter(m=>m.tipo===fT);
  if(fS) r=r.filter(m=>m.estado===fS);
  return r;
}

function labCascada(){
  const pid=parseInt(document.getElementById('lab-f-proy')?.value)||null;
  const sel=document.getElementById('lab-f-ens'); if(!sel) return;
  const ens=pid?ENSAYOS.filter(e=>e.proyectoId===pid):ensayosVisibles();
  sel.innerHTML='<option value="">— Todos —</option>'+ens.map(e=>`<option value="${e.id}">${e.codigo} · ${e.finca}</option>`).join('');
  labRenderTab();
}

function renderLabTable(){
  const ps=document.getElementById('lab-f-proy'); if(!ps) return;
  ps.innerHTML='<option value="">— Todos —</option>';
  proyectosVisibles().forEach(p=>{const o=document.createElement('option');o.value=p.id;o.textContent=`${p.codigo} — ${p.nombre}`;ps.appendChild(o);});
  labRenderTab();
}

function labRenderTab(){
  const rows=labGetRows();
  labKpis(rows);
  if(_labTab==='matriz') labMatriz(rows);
  else labListado(rows);
}

function labKpis(rows){
  const d=document.getElementById('lab-kpis'); if(!d) return;
  const comp=rows.filter(m=>m.estado==='Completado').length;
  const proc=rows.filter(m=>m.estado==='En proceso').length;
  const pend=rows.filter(m=>m.estado==='Pendiente').length;
  const tipos=[...new Set(rows.map(m=>m.tipo))];
  d.innerHTML=`<div class="kpi-grid" style="margin-bottom:0;">
    <div class="kpi-card" style="border-color:#1f6fbf;"><div class="kpi-top"><span style="font-size:11.5px;color:var(--texto-suave);">Total muestras</span><div class="kpi-icon" style="background:#1f6fbf;"><i class="fa-solid fa-database"></i></div></div><div class="kpi-val">${rows.length}</div><div class="kpi-label">${tipos.join(', ')||'—'}</div></div>
    <div class="kpi-card" style="border-color:#73BC25;"><div class="kpi-top"><span style="font-size:11.5px;color:var(--texto-suave);">Completadas</span><div class="kpi-icon" style="background:#73BC25;"><i class="fa-solid fa-circle-check"></i></div></div><div class="kpi-val">${comp}</div><div class="kpi-label">${rows.length?Math.round(comp/rows.length*100):0}% del total</div></div>
    <div class="kpi-card" style="border-color:#FFCC00;"><div class="kpi-top"><span style="font-size:11.5px;color:var(--texto-suave);">En proceso</span><div class="kpi-icon" style="background:#FFCC00;color:#555;"><i class="fa-solid fa-hourglass-half"></i></div></div><div class="kpi-val">${proc}</div><div class="kpi-label">analitos incompletos</div></div>
    <div class="kpi-card" style="border-color:#FF6B00;"><div class="kpi-top"><span style="font-size:11.5px;color:var(--texto-suave);">Pendientes</span><div class="kpi-icon" style="background:#FF6B00;"><i class="fa-solid fa-clock"></i></div></div><div class="kpi-val">${pend}</div><div class="kpi-label">sin ingresar</div></div>
  </div>`;
}

function labMatriz(rows){
  const cont=document.getElementById('lab-mat-cont');
  const info=document.getElementById('lab-info');
  if(!cont) return;
  if(!rows.length){
    cont.innerHTML=`<div style="text-align:center;padding:48px;color:var(--texto-suave);"><i class="fa-solid fa-flask-vial" style="font-size:36px;opacity:.2;display:block;margin-bottom:10px;"></i>Sin muestras para los filtros seleccionados</div>`;
    return;
  }
  const canEdit=can('create_muestra')||session.rol==='administrador';
  const tipos=[...new Set(rows.map(m=>m.tipo))];
  const etaCols=['ID Muestra','Proyecto','Ensayo','Tipo','Trat.','Rep.','Finca','Lote','F.Ingreso','Estado','F.Result.','Analistas'];
  let h=`<div class="lab-mat-scroll"><table class="lmt"><thead><tr>`;
  etaCols.forEach(c=>h+=`<th class="th-eta" rowspan="2">${c}</th>`);
  tipos.forEach(tipo=>{
    const anas=ANALITOS_POR_TIPO[tipo]||[];
    if(!anas.length) return;
    h+=`<th class="th-grp" colspan="${anas.length}">${tipo}</th>`;
  });
  h+=`<th class="th-eta" rowspan="2"></th></tr><tr>`;
  tipos.forEach(tipo=>{
    const anas=ANALITOS_POR_TIPO[tipo]||[];
    anas.forEach((a,ai)=>h+=`<th class="th-ana" style="${ai===0?'border-left:2px solid rgba(255,255,255,.3);':''}" title="${a.label}${a.unidad?' ('+a.unidad+')':''}">${a.label}${a.unidad?`<br><span style="font-size:9px;font-weight:400;opacity:.7;">${a.unidad}</span>`:''}</th>`);
  });
  h+=`</tr></thead><tbody>`;
  let tc=0,cv=0;
  rows.forEach(m=>{
    const ens=ENSAYOS.find(e=>e.id===m.ensayoId),proy=PROYECTOS.find(p=>p.id===m.proyectoId);
    const ec=m.estado==='Completado'?'est-comp':m.estado==='En proceso'?'est-proc':'est-pend';
    h+=`<tr>
      <td class="eta"><b>${m.idMuestra}</b></td>
      <td class="eta">${proy?`<b style="font-size:11px;">${proy.codigo}</b>`:'—'}</td>
      <td class="eta">${ens?ens.codigo:'—'}</td>
      <td class="eta"><span class="tag tag-blue" style="font-size:10px;">${m.tipo}</span></td>
      <td class="eta" style="text-align:center;font-weight:700;color:#1e40af;">${m.tratamiento}</td>
      <td class="eta" style="text-align:center;">Rep.${m.repeticion}</td>
      <td class="eta">${m.finca}</td>
      <td class="eta">${m.lote}</td>
      <td class="eta" style="white-space:nowrap;">${m.fecha}</td>
      <td class="eta"><span class="${ec}">${m.estado}</span></td>
      <td class="eta" style="white-space:nowrap;">${m.fechaResultado||'—'}</td>
      <td class="eta" style="font-size:11px;">${m.analistas||'—'}</td>`;
    tipos.forEach((tipo,ti)=>{
      const anas=ANALITOS_POR_TIPO[tipo]||[];
      const mismo=m.tipo===tipo;
      anas.forEach((a,ai)=>{
        const bl=ai===0?'border-left:2px solid #93c5fd':'border-left:1px solid #e8ecf5';
        if(!mismo){
          h+=`<td class="na-cell" style="padding:0;"><div class="ana-in" style="${bl};cursor:default;opacity:.25;"><span style="font-size:11px;">—</span></div></td>`;
        } else {
          tc++;
          const v=m.analitos?.[a.clave];
          const has=v!==undefined&&v!==null&&v!=='';
          if(has){cv++;h+=`<td class="ana-cell ana-with" style="padding:0;"><div class="ana-in" style="${bl};" onclick="${canEdit?`labEditCell(${m.id},'${a.clave}',${v})`:''}" title="${a.label}: ${v} ${a.unidad}"><div><div class="ana-val">${v}</div>${a.unidad?`<span class="ana-unit">${a.unidad}</span>`:''}</div></div></td>`;}
          else {h+=`<td class="ana-cell" style="padding:0;"><div class="ana-in" style="${bl};" onclick="${canEdit?`labAddCell(${m.id},'${a.clave}')`:''}" title="Sin dato — clic para ingresar"><span class="ana-empty">+</span></div></td>`;}
        }
      });
    });
    h+=`<td class="eta">${canEdit?`<div class="btn-icon" onclick="openMuestraModal(${m.id})"><i class="fa-solid fa-pen"></i></div>`:''}</td></tr>`;
  });
  h+=`</tbody></table></div>`;
  const pct=tc>0?Math.round(cv/tc*100):0;
  if(info) info.innerHTML=`<i class="fa-solid fa-flask-vial" style="color:#1f6fbf;"></i><span><b>${rows.length}</b> muestra${rows.length!==1?'s':''} · ${tipos.join(', ')} · <b style="color:${pct>=80?'#3a6b10':pct>=40?'#7a6000':'#a0390a'};">${cv}/${tc} analitos con valor (${pct}%)</b> — Clic en <b style="color:#1f6fbf;">+</b> para ingresar, en un valor para editarlo.</span>`;
  cont.innerHTML=h;
}

function labAddCell(muestraId,clave){
  const m=MUESTRAS_LAB.find(x=>x.id===muestraId);
  const a=(ANALITOS_POR_TIPO[m?.tipo]||[]).find(x=>x.clave===clave);
  if(!m||!a) return;
  openModal(`Ingresar: ${a.label} — ${m.idMuestra}`,`
    <div class="lab-info-bar" style="margin-bottom:12px;"><i class="fa-solid fa-barcode"></i>
      <span style="font-family:monospace;font-size:11.5px;">${m.idMuestra}</span> · ${m.tipo} · ${m.tratamiento} · Rep.${m.repeticion}</div>
    <div class="form-row">
      <div class="form-group"><label>Analito</label>
        <input type="text" value="${a.label}${a.unidad?' ('+a.unidad+')':''}" disabled style="background:#f0f4ff;"></div>
      <div class="form-group"><label>Valor${a.unidad?` <span style="color:#1f6fbf;">(${a.unidad})</span>`:''}</label>
        <input type="number" step="0.001" id="la-v" placeholder="0.000" autofocus></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Analista / Laboratorio</label>
        <input id="la-an" value="${m.analistas||''}"></div>
      <div class="form-group"><label>Fecha resultado</label>
        <input type="date" id="la-fr" value="${m.fechaResultado||new Date().toISOString().slice(0,10)}"></div>
    </div>`,()=>{
    const v=parseFloat(val('la-v'));
    if(isNaN(v)){showToast('error','Valor requerido','Ingresa un número.');return false;}
    if(!m.analitos) m.analitos={};
    m.analitos[clave]=v;
    if(val('la-an')) m.analistas=val('la-an');
    if(val('la-fr')) m.fechaResultado=val('la-fr');
    const anas=ANALITOS_POR_TIPO[m.tipo]||[];
    const n=anas.filter(x=>m.analitos[x.clave]!==undefined).length;
    m.estado=n===anas.length&&anas.length>0?'Completado':(n>0?'En proceso':m.estado);
    showToast('success','Analito registrado',`${a.label}: ${v} ${a.unidad}`);
    labRenderTab(); return true;
  });
}

function labEditCell(muestraId,clave,valorActual){
  const m=MUESTRAS_LAB.find(x=>x.id===muestraId);
  const a=(ANALITOS_POR_TIPO[m?.tipo]||[]).find(x=>x.clave===clave);
  if(!m||!a) return;
  openModal(`Editar: ${a.label} — ${m.idMuestra}`,`
    <div class="lab-info-bar" style="margin-bottom:12px;"><i class="fa-solid fa-pen-to-square"></i>
      <span>${m.tipo} · ${m.tratamiento} · Rep.${m.repeticion} · ${m.fecha}</span></div>
    <div class="form-row">
      <div class="form-group"><label>Valor actual</label>
        <input type="text" value="${valorActual} ${a.unidad}" disabled style="background:#f0f4ff;"></div>
      <div class="form-group"><label>Nuevo valor${a.unidad?` (${a.unidad})`:''}</label>
        <input type="number" step="0.001" id="le-v" value="${valorActual}" autofocus></div>
    </div>
    ${session.rol==='administrador'?`<div style="margin-top:8px;"><button class="btn btn-secondary btn-sm" style="color:#c94c2e;border-color:#c94c2e;" onclick="labDelCell(${muestraId},'${clave}')"><i class="fa-solid fa-trash"></i> Eliminar valor</button></div>`:''}`,()=>{
    const v=parseFloat(val('le-v'));
    if(isNaN(v)){showToast('error','Valor inválido','');return false;}
    m.analitos[clave]=v;
    showToast('success','Valor actualizado',`${a.label}: ${v} ${a.unidad}`);
    labRenderTab(); return true;
  });
}

function labDelCell(muestraId,clave){
  const m=MUESTRAS_LAB.find(x=>x.id===muestraId);
  if(m&&m.analitos) delete m.analitos[clave];
  closeModal(); showToast('warn','Valor eliminado',''); labRenderTab();
}

function labListado(rows){
  const ct=document.getElementById('lab-lst-ct'); if(ct) ct.textContent=`${rows.length} registros`;
  const tbody=document.getElementById('lab-lst-tbody'); if(!tbody) return;
  if(!rows.length){tbody.innerHTML=`<tr><td colspan="12" style="text-align:center;padding:40px;color:var(--texto-suave);">Sin registros.</td></tr>`;return;}
  const canEdit=can('create_muestra')||session.rol==='administrador';
  tbody.innerHTML=rows.map(m=>{
    const ens=ENSAYOS.find(e=>e.id===m.ensayoId),proy=PROYECTOS.find(p=>p.id===m.proyectoId);
    const anas=ANALITOS_POR_TIPO[m.tipo]||[];
    const nv=anas.filter(a=>m.analitos?.[a.clave]!==undefined).length;
    const ec=m.estado==='Completado'?'est-comp':m.estado==='En proceso'?'est-proc':'est-pend';
    const res=anas.slice(0,4).map(a=>{const v=m.analitos?.[a.clave];return v!==undefined?`<span style="font-size:11px;margin-right:5px;color:#0d2d52;"><b>${a.label}:</b>${v}${a.unidad?' '+a.unidad:''}</span>`:''}).join('');
    return `<tr>
      <td style="padding:8px 11px;"><span style="font-family:monospace;font-size:11px;color:#0d2d52;">${m.idMuestra}</span></td>
      <td style="padding:8px 11px;font-size:12px;">${proy?proy.codigo:'—'}</td>
      <td style="padding:8px 11px;font-size:12px;">${ens?ens.codigo:'—'}</td>
      <td style="padding:8px 11px;"><span class="tag tag-blue" style="font-size:10px;">${m.tipo}</span></td>
      <td style="padding:8px 11px;font-size:12px;font-weight:700;color:#1e40af;">${m.tratamiento}</td>
      <td style="padding:8px 11px;font-size:11.5px;text-align:center;">Rep.${m.repeticion}</td>
      <td style="padding:8px 11px;font-size:11.5px;">${m.finca}/${m.lote}</td>
      <td style="padding:8px 11px;font-size:11.5px;white-space:nowrap;">${m.fecha}</td>
      <td style="padding:8px 11px;"><span class="${ec}">${m.estado}</span></td>
      <td style="padding:8px 11px;">${res||'<span style="color:#bbb;font-style:italic;font-size:11px;">Sin analitos</span>'}<div style="font-size:10px;color:var(--texto-suave);margin-top:2px;">${nv}/${anas.length} analitos</div></td>
      <td style="padding:8px 11px;font-size:11.5px;white-space:nowrap;">${m.fechaResultado||'—'}</td>
      <td style="padding:8px 11px;">${canEdit?`<div class="btn-icon" onclick="openMuestraModal(${m.id})"><i class="fa-solid fa-pen"></i></div>`:''}</td>
    </tr>`;
  }).join('');
}

function labExport(){
  const rows=labGetRows();
  if(!rows.length){showToast('warn','Sin datos','');return;}
  const tipos=[...new Set(rows.map(m=>m.tipo))];
  const wb=XLSX.utils.book_new();
  tipos.forEach(tipo=>{
    const tr=rows.filter(m=>m.tipo===tipo);
    const anas=ANALITOS_POR_TIPO[tipo]||[];
    const hdr=['ID_Muestra','Proyecto','Ensayo','Tipo','Tratamiento','Repeticion','Finca','Lote','Fecha_ingreso','Estado','Fecha_resultado','Analistas',...anas.map(a=>`${a.label}${a.unidad?' ('+a.unidad+')':''}`)];
    const data=tr.map(m=>{
      const ens=ENSAYOS.find(e=>e.id===m.ensayoId),proy=PROYECTOS.find(p=>p.id===m.proyectoId);
      const row=[m.idMuestra,proy?.codigo||'',ens?.codigo||'',m.tipo,m.tratamiento,m.repeticion,m.finca,m.lote,m.fecha,m.estado,m.fechaResultado||'',m.analistas||''];
      anas.forEach(a=>row.push(m.analitos?.[a.clave]!==undefined?m.analitos[a.clave]:''));
      return row;
    });
    const ws=XLSX.utils.aoa_to_sheet([hdr,...data]);
    XLSX.utils.book_append_sheet(wb,ws,tipo.replace(/\s+/g,'_').slice(0,20));
  });
  XLSX.writeFile(wb,`BD_Lab_${new Date().toISOString().slice(0,10)}.xlsx`);
  showToast('success','BD exportada',`${rows.length} muestras`);
}

function openMuestraModal(id){
  const edit=id?MUESTRAS_LAB.find(m=>m.id===id):null;
  const ensDisp=ensayosVisibles();
  const tipos=Object.keys(ANALITOS_POR_TIPO);
  openModal(edit?`Editar — ${edit.idMuestra}`:'Nueva muestra de laboratorio',`
    ${!edit?`<div style="margin-bottom:12px;padding:10px 13px;background:#eff6ff;border:1.5px solid #bfdbfe;border-radius:8px;">
      <span style="font-size:11px;color:var(--texto-suave);">ID generado automáticamente:</span>
      <div id="prev-id" style="font-family:monospace;font-size:12px;color:#0d2d52;font-weight:700;margin-top:4px;">—</div></div>`:''}
    <div class="form-row">
      <div class="form-group"><label>Fecha de ingreso</label>
        <input type="date" id="fm-f" value="${edit?edit.fecha:new Date().toISOString().slice(0,10)}"></div>
      <div class="form-group"><label>Tipo de muestra</label>
        <select id="fm-t" onchange="fmPrevId();fmAnas()">${tipos.map(t=>`<option ${edit&&edit.tipo===t?'selected':''}>${t}</option>`).join('')}</select></div>
    </div>
    <div class="form-group"><label>Ensayo</label>
      <select id="fm-e" onchange="fmPrevId();fmTrat()">
        ${ensDisp.map(e=>{const p=PROYECTOS.find(x=>x.id===e.proyectoId);return`<option value="${e.id}" data-proy="${e.proyectoId}" ${edit&&edit.ensayoId===e.id?'selected':''}>${e.codigo} — ${p?p.codigo:''} ${e.finca}</option>`;}).join('')}
      </select></div>
    <div class="form-row">
      <div class="form-group"><label>Tratamiento</label><select id="fm-tr">${edit?`<option>${edit.tratamiento}</option>`:''}</select></div>
      <div class="form-group"><label>Repetición</label><input type="number" min="1" id="fm-r" value="${edit?edit.repeticion:1}"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Analistas / Laboratorio</label><input id="fm-an" value="${edit?edit.analistas||'':''}"></div>
      <div class="form-group"><label>Fecha de resultado</label><input type="date" id="fm-fr" value="${edit?edit.fechaResultado||'':''}"></div>
    </div>
    <div style="margin-top:10px;padding:12px 14px;background:#f8faff;border:1.5px solid #bfdbfe;border-radius:8px;">
      <div style="font-size:12px;font-weight:700;color:#0d2d52;margin-bottom:10px;">
        <i class="fa-solid fa-flask-vial" style="color:#1f6fbf;margin-right:6px;"></i>
        Resultados de análisis <span style="font-weight:400;font-size:11px;color:var(--texto-suave);">(vacío = sin dato aún)</span>
      </div>
      <div id="fm-anas" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;"></div>
    </div>
    <div class="form-group" style="margin-top:10px;"><label>Observaciones</label>
      <textarea id="fm-o" rows="2">${edit?edit.obs||'':''}</textarea></div>`,()=>{
    const fecha=val('fm-f'),tipo=val('fm-t'),obs=val('fm-o');
    const ensEl=document.getElementById('fm-e');
    const eId=parseInt(ensEl?.value||0);
    const pId=parseInt(ensEl?.options[ensEl?.selectedIndex]?.getAttribute('data-proy')||0)||null;
    const ens=ENSAYOS.find(e=>e.id===eId);
    const trat=val('fm-tr'),rep=parseInt(val('fm-r'))||1;
    const analistas=val('fm-an')||'—',fr=val('fm-fr')||null;
    if(!fecha||!tipo||!eId){showToast('error','Faltan datos','Fecha, tipo y ensayo son obligatorios.');return false;}
    const anas=ANALITOS_POR_TIPO[tipo]||[];
    const analitos={};
    anas.forEach(a=>{const v=parseFloat(document.getElementById('fma-'+a.clave)?.value||'');if(!isNaN(v)) analitos[a.clave]=v;});
    const nv=anas.filter(a=>analitos[a.clave]!==undefined).length;
    const estado=nv===anas.length&&anas.length>0?'Completado':(nv>0?'En proceso':'Pendiente');
    if(edit){
      Object.assign(edit,{fecha,tipo,obs,ensayoId:eId,proyectoId:pId,finca:ens?.finca||edit.finca,lote:ens?.lote||edit.lote,tratamiento:trat,repeticion:rep,estado,analitos,analistas,fechaResultado:fr});
      showToast('success','Muestra actualizada',edit.idMuestra);
    } else {
      const idM=generarIdMuestra(pId,eId,tipo,MUESTRAS_LAB.length+1);
      MUESTRAS_LAB.push({id:nextId(MUESTRAS_LAB),idMuestra:idM,fecha,tipo,proyectoId:pId,ensayoId:eId,finca:ens?.finca||'—',lote:ens?.lote||'—',tratamiento:trat,repeticion:rep,estado,analitos,obs,solicitante:session.nombre,analistas,fechaResultado:fr});
      showToast('success','Muestra registrada',idM);
    }
    labRenderTab(); return true;
  });
  setTimeout(()=>{fmPrevId();fmTrat();fmAnas();},0);
}

function fmPrevId(){
  const el=document.getElementById('prev-id'); if(!el) return;
  const ensEl=document.getElementById('fm-e');
  const eId=parseInt(ensEl?.value||0);
  const pId=parseInt(ensEl?.options[ensEl?.selectedIndex]?.getAttribute('data-proy')||0)||null;
  el.textContent=generarIdMuestra(pId,eId,val('fm-t'),MUESTRAS_LAB.length+1);
}
function fmTrat(){
  const ensEl=document.getElementById('fm-e'); if(!ensEl) return;
  const ts=document.getElementById('fm-tr'); if(!ts) return;
  const trats=TRATAMIENTOS.filter(t=>t.ensayoId===parseInt(ensEl.value));
  ts.innerHTML=trats.map(t=>`<option>${t.codigo}${t.descripcion?' — '+t.descripcion:''}</option>`).join('')||'<option>Sin tratamientos</option>';
  fmPrevId();
}
function fmAnas(){
  const tipo=val('fm-t'),anas=ANALITOS_POR_TIPO[tipo]||[];
  const wrap=document.getElementById('fm-anas'); if(!wrap) return;
  const editMuestra=MUESTRAS_LAB.find(m=>m.idMuestra===document.getElementById('prev-id')?.textContent);
  wrap.innerHTML=anas.map(a=>`<div>
    <label style="font-size:11px;font-weight:600;color:#1e3a5f;display:block;margin-bottom:3px;">${a.label}${a.unidad?` <span style="font-weight:400;color:var(--texto-suave);">(${a.unidad})</span>`:''}</label>
    <input type="number" step="0.001" id="fma-${a.clave}" placeholder="—" value="${editMuestra&&editMuestra.analitos?.[a.clave]!==undefined?editMuestra.analitos[a.clave]:''}" style="width:100%;padding:6px 8px;border:1.5px solid #bfdbfe;border-radius:7px;font-size:12.5px;font-weight:600;text-align:right;outline:none;">
  </div>`).join('');
}

function renderArchivosTable(){
  const sel = document.getElementById('arc-filter-proy'); if(!sel) return;
  const visProys = proyectosVisibles();
  sel.innerHTML = '<option value="">Todos mis proyectos</option>' + visProys.map(p=>`<option value="${p.id}">${p.codigo} — ${p.nombre}</option>`).join('');
  const filterProy = parseInt(val('arc-filter-proy'))||null;
  const visProyIds = visProys.map(p=>p.id);
  let rows = ARCHIVOS.filter(a=>visProyIds.includes(a.proyectoId));
  if(filterProy) rows = rows.filter(a=>a.proyectoId===filterProy);
  const tree = document.getElementById('arc-file-tree'); if(!tree) return;
  if(!rows.length){ tree.innerHTML = emptyState('fa-paperclip','Sin archivos adjuntos'); return; }
  const iconMap = {PDF:'fa-file-pdf',Excel:'fa-file-excel',Word:'fa-file-word',Imagen:'fa-file-image',ZIP:'fa-file-zipper'};
  // group by proyecto then carpeta
  const byProy = {};
  rows.forEach(a=>{ (byProy[a.proyectoId]=byProy[a.proyectoId]||[]).push(a); });
  tree.innerHTML = Object.entries(byProy).map(([pid,files])=>{
    const proy = PROYECTOS.find(p=>p.id===parseInt(pid));
    const carpetas = [...new Set(files.map(f=>f.carpeta||'General'))];
    return `<div style="margin-bottom:16px;">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
        <i class="fa-solid fa-folder" style="color:var(--naranja);"></i>
        <b style="font-size:13.5px;">${proy?proy.nombre:'Proyecto'}</b>
        <span class="tag tag-blue">${proy?proy.codigo:''}</span>
      </div>
      <div class="file-tree" style="padding-left:18px;">
        ${carpetas.map(c=>{
          const cf = files.filter(f=>(f.carpeta||'General')===c);
          return `<div class="file-folder">
            <div class="file-folder-head"><i class="fa-solid fa-folder-open fold-icon"></i><span>${c}</span><span class="tag tag-gray" style="margin-left:auto;">${cf.length}</span></div>
            <div class="file-folder-body">${cf.map(f=>`
              <div class="file-item">
                <i class="fa-solid ${iconMap[f.tipo]||'fa-file'}" style="color:var(--naranja);"></i>
                <div class="fi-name">${f.nombre}</div>
                <div class="fi-meta">${f.tamano} · ${f.fecha} · ${f.subidoPor||'—'}</div>
                <div class="btn-icon" onclick="showToast('success','Descarga simulada','${f.nombre}')"><i class="fa-solid fa-download"></i></div>
                ${session.rol==='administrador'?`<div class="btn-icon" onclick="deleteArchivo(${f.id})"><i class="fa-solid fa-trash"></i></div>`:''}
              </div>`).join('')}
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');
}

/* ===================== TRATAMIENTOS / PARCELAS CRUD ===================== */
function switchEnsayoTab(idx){
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active',i===idx));
  document.querySelectorAll('.tab-panel').forEach((p,i)=>p.classList.toggle('active',i===idx));
}
function updateTrat(id, field, value){
  const t = TRATAMIENTOS.find(x=>x.id===id);
  if(t){ t[field]=value; showToast('success','Tratamiento actualizado',''); }
}
function deleteTrat(id, ensayoId){
  if(!confirm('¿Eliminar este tratamiento? También se eliminarán sus parcelas.')) return;
  TRATAMIENTOS = TRATAMIENTOS.filter(t=>t.id!==id);
  PARCELAS = PARCELAS.filter(p=>!(p.ensayoId===ensayoId && p.tratamientoCodigo===TRATAMIENTOS.find(t=>t.id===id)?.codigo));
  showToast('warn','Tratamiento eliminado','');
  // refresh visible table
  const tb = document.getElementById('trat-tbody-'+ensayoId);
  if(tb) tb.innerHTML = TRATAMIENTOS.filter(t=>t.ensayoId===ensayoId).map(t=>`<tr class="trat-row" data-tid="${t.id}">
    <td><input value="${t.codigo}" onchange="updateTrat(${t.id},'codigo',this.value)"></td>
    <td><input value="${t.descripcion}" onchange="updateTrat(${t.id},'descripcion',this.value)"></td>
    <td><input type="number" min="1" value="${t.unidades}" style="width:70px;" onchange="updateTrat(${t.id},'unidades',parseInt(this.value))"></td>
    <td><button class="btn btn-danger btn-sm" onclick="deleteTrat(${t.id},${ensayoId})"><i class="fa-solid fa-trash"></i></button></td>
  </tr>`).join('') || `<tr><td colspan="4" style="color:var(--texto-suave);font-size:12px;padding:14px;">Sin tratamientos</td></tr>`;
}
function addTratRow(ensayoId){
  const existing = TRATAMIENTOS.filter(t=>t.ensayoId===ensayoId);
  const newCode = 'T'+(existing.length+1);
  const newTrat = {id:nextId(TRATAMIENTOS),ensayoId,codigo:newCode,descripcion:'',unidades:1};
  TRATAMIENTOS.push(newTrat);
  const tb = document.getElementById('trat-tbody-'+ensayoId); if(!tb) return;
  const row = document.createElement('tr');
  row.className = 'trat-row';
  row.setAttribute('data-tid', newTrat.id);
  row.innerHTML = `
    <td><input value="${newCode}" onchange="updateTrat(${newTrat.id},'codigo',this.value)"></td>
    <td><input value="" placeholder="Descripción del tratamiento" onchange="updateTrat(${newTrat.id},'descripcion',this.value)"></td>
    <td><input type="number" min="1" value="1" style="width:70px;" onchange="updateTrat(${newTrat.id},'unidades',parseInt(this.value))"></td>
    <td><button class="btn btn-danger btn-sm" onclick="deleteTrat(${newTrat.id},${ensayoId})"><i class="fa-solid fa-trash"></i></button></td>`;
  tb.appendChild(row);
  row.querySelector('td:nth-child(2) input').focus();
  showToast('success','Tratamiento agregado',newCode+' — edita la descripción');
}
function generarParcelasAuto(ensayoId){
  const ensayo = ENSAYOS.find(e=>e.id===ensayoId);
  const trats = TRATAMIENTOS.filter(t=>t.ensayoId===ensayoId);
  if(!trats.length){ showToast('warn','Sin tratamientos','Agrega al menos un tratamiento primero.'); return; }
  const reps = ensayo?parseInt(ensayo.numRepeticiones)||3:3;
  const area = ensayo?ensayo.areaParcela:'50';
  // remove old parcelas for this ensayo
  PARCELAS = PARCELAS.filter(p=>p.ensayoId!==ensayoId);
  let counter=1;
  for(let r=1;r<=reps;r++){
    trats.forEach(t=>{
      PARCELAS.push({id:nextId(PARCELAS),ensayoId,codigo:'P-'+String(counter).padStart(2,'0'),tratamientoCodigo:t.codigo,repeticion:r,area,notas:''});
      counter++;
    });
  }
  // refresh parcelas table
  const pb = document.getElementById('parc-tbody-'+ensayoId);
  const parc = PARCELAS.filter(p=>p.ensayoId===ensayoId);
  if(pb) pb.innerHTML = parc.map(p=>`<tr>
    <td><b>${p.codigo}</b></td>
    <td><span class="tag tag-blue">${p.tratamientoCodigo}</span></td>
    <td>${p.repeticion}</td>
    <td>${p.area} m²</td>
    <td style="font-size:11px;color:var(--texto-suave);">—</td>
  </tr>`).join('');
  showToast('success','Parcelas generadas',parc.length+' parcelas ('+trats.length+' trats × '+reps+' reps)');
}

/* ===================== NDVI MODAL ===================== */
function openNdviModal(ensayoId){
  if(!can('register_evaluacion')){ showToast('error','Acceso denegado','No tienes permisos para registrar NDVI.'); return; }
  const trats = TRATAMIENTOS.filter(t=>t.ensayoId===ensayoId);
  openModal('Registrar valor NDVI', `
    <p style="font-size:12.5px;color:var(--texto-suave);margin-bottom:14px;">Ingresa valores de NDVI obtenidos de imágenes satelitales (Sentinel-2, dron, GEE). El rango válido es 0.0 a 1.0.</p>
    <div class="form-row">
      <div class="form-group"><label>Tratamiento</label><select id="f-ndvi-trat">${trats.map(t=>`<option value="${t.codigo}">${t.codigo} — ${t.descripcion}</option>`).join('')||'<option value="">Sin tratamientos</option>'}</select></div>
      <div class="form-group"><label>Fecha / Período</label><input id="f-ndvi-fecha" placeholder="Ej. 2026-06" value="2026-06"></div>
    </div>
    <div class="form-group"><label>Valor NDVI</label><input type="number" step="0.01" min="0" max="1" id="f-ndvi-valor" placeholder="Ej. 0.75"></div>
    <div class="form-group"><label>Fuente de imagen</label><select id="f-ndvi-fuente">
      <option>Sentinel-2 (Copernicus)</option>
      <option>Dron / UAV</option>
      <option>Landsat-8</option>
      <option>Google Earth Engine</option>
    </select></div>
  `, ()=>{
    const trat=val('f-ndvi-trat'), fecha=val('f-ndvi-fecha'), valor=parseFloat(val('f-ndvi-valor'));
    if(!trat||!fecha||isNaN(valor)||valor<0||valor>1){ showToast('error','Datos inválidos','Verifica el tratamiento, la fecha y que el NDVI esté entre 0 y 1.'); return false; }
    let series = NDVI_DATA.find(n=>n.ensayoId===ensayoId&&n.tratCodigo===trat);
    if(!series){ series={ensayoId,tratCodigo:trat,registros:[]}; NDVI_DATA.push(series); }
    const existing = series.registros.find(r=>r.fecha===fecha);
    if(existing) existing.valor=valor; else series.registros.push({fecha,valor});
    series.registros.sort((a,b)=>a.fecha.localeCompare(b.fecha));
    showToast('success','NDVI registrado',`${trat} · ${fecha} · ${valor.toFixed(2)}`);
    return true;
  });
}

function exportarAnalisisExcel(){

const TIPO_BITACORA=['Siembra','Fertilización','Control de maleza','Aplicación de producto','Evaluación de campo','Muestreo','Cosecha','Mantenimiento','Incidencia fitosanitaria','Visita técnica','Otro'];
const TIPO_CLASS={'Siembra':'tipo-siembra','Fertilización':'tipo-fertilizacion','Cosecha':'tipo-cosecha','Evaluación de campo':'tipo-evaluacion','Muestreo':'tipo-muestreo','Aplicación de producto':'tipo-aplicacion'};
function tipoBitacoraClass(t){ return TIPO_CLASS[t]||'tipo-otro'; }

function pageBitacora(){
  return `<div class="page" id="page-bitacora">
    <div class="page-header">
      <div><h1>Bitácora de campo</h1><p>Registro cronológico de actividades por ensayo</p></div>

    </div>
    <div class="card">
      <div class="table-toolbar" style="margin-bottom:16px;">
        <div class="search-box"><i class="fa-solid fa-magnifying-glass"></i><input id="bit-search" placeholder="Buscar descripción o responsable..." oninput="renderBitacoraTable()"></div>
        <select class="filter-select" id="bit-filter-ensayo" onchange="renderBitacoraTable()">
          <option value="">Todos los ensayos</option>
        </select>
        <select class="filter-select" id="bit-filter-tipo" onchange="renderBitacoraTable()">
          <option value="">Todos los tipos</option>
          ${TIPO_BITACORA.map(t=>`<option>${t}</option>`).join('')}
        </select>
      </div>
      <div id="bit-timeline"></div>
    </div>
  </div>`;
}

function renderBitacoraTable(){
  const timelineDiv=document.getElementById('bit-timeline'); if(!timelineDiv) return;
  const selEns=document.getElementById('bit-filter-ensayo');
  const visEnsIds=ensayosVisibles().map(e=>e.id);
  if(selEns && selEns.options.length<=1){
    selEns.innerHTML='<option value="">Todos los ensayos</option>'+ensayosVisibles().map(e=>`<option value="${e.id}">${e.codigo} · ${e.finca}</option>`).join('');
  }
  const q=(val('bit-search')||'').toLowerCase();
  const fEns=val('bit-filter-ensayo');
  const fTipo=val('bit-filter-tipo');
  let entries=BITACORA.filter(b=>visEnsIds.includes(b.ensayoId));
  if(fEns) entries=entries.filter(b=>b.ensayoId===parseInt(fEns));
  if(fTipo) entries=entries.filter(b=>b.tipo===fTipo);
  if(q) entries=entries.filter(b=>b.descripcion.toLowerCase().includes(q)||b.responsable.toLowerCase().includes(q));
  entries=[...entries].sort((a,b)=>b.fecha.localeCompare(a.fecha));
  if(!entries.length){ timelineDiv.innerHTML=emptyState('fa-book-open','Sin entradas en la bitácora para este filtro'); return; }
  // group by month
  const byMonth={};
  entries.forEach(b=>{ const m=b.fecha.slice(0,7); (byMonth[m]=byMonth[m]||[]).push(b); });
  timelineDiv.innerHTML=Object.entries(byMonth).sort(([a],[b])=>b.localeCompare(a)).map(([month,items])=>{
    const [y,m]=month.split('-');
    const mNames=['','Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
    return `<div style="margin-bottom:20px;">
      <div style="font-size:12px;font-weight:700;color:var(--texto-suave);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--borde);">${mNames[parseInt(m)]} ${y}</div>
      <div class="bitacora-timeline">
        ${items.map(b=>{
          const ensayo=ENSAYOS.find(e=>e.id===b.ensayoId);
          return `<div class="bit-entry">
            <div class="bit-dot" style="background:${dotColorForTipo(b.tipo)};box-shadow:0 0 0 2px ${dotColorForTipo(b.tipo)};"></div>
            <div class="bit-card">
              <div class="bit-head">
                <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                  <span class="bit-tipo ${tipoBitacoraClass(b.tipo)}">${b.tipo}</span>
                  ${ensayo?`<span class="tag tag-green">${ensayo.codigo}</span>`:''}
                </div>
                <div style="display:flex;gap:6px;align-items:center;">
                  <span style="font-size:11.5px;color:var(--texto-suave);white-space:nowrap;">${b.fecha}</span>
                  ${can('write_bitacora')?`<div class="btn-icon" onclick="openBitacoraModal(${b.id})" title="Editar"><i class="fa-solid fa-pen"></i></div>`:''}
                  ${session.rol==='administrador'?`<div class="btn-icon" onclick="deleteBitacora(${b.id})" title="Eliminar"><i class="fa-solid fa-trash"></i></div>`:''}
                </div>
              </div>
              <div class="bit-desc">${b.descripcion}</div>
              <div class="bit-meta">
                <span><i class="fa-solid fa-user" style="margin-right:4px;"></i>${b.responsable}</span>
                ${ensayo?`<span><i class="fa-solid fa-map-pin" style="margin-right:4px;"></i>${ensayo.finca} / ${ensayo.lote}</span>`:''}
              </div>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');
}
function dotColorForTipo(t){
  const m={'Siembra':'#73BC25','Fertilización':'#FFCC00','Cosecha':'#FF6B00','Evaluación de campo':'#1f6fbf','Muestreo':'#7B2FBE','Aplicación de producto':'#c4471b','Control de maleza':'#A3D300'};
  return m[t]||'#6a7466';
}
function openBitacoraModal(id){
  if(!can('write_bitacora')){ showToast('error','Acceso denegado','No tienes permisos para escribir en la bitácora.'); return; }
  const edit=id?BITACORA.find(b=>b.id===id):null;
  const ensDisp=ensayosVisibles();
  openModal(edit?'Editar entrada de bitácora':'Nueva entrada de bitácora', `
    <div class="form-row">
      <div class="form-group"><label>Fecha</label><input type="date" id="f-bit-fecha" value="${edit?edit.fecha:'2026-06-19'}"></div>
      <div class="form-group"><label>Tipo de actividad</label><select id="f-bit-tipo">
        ${TIPO_BITACORA.map(t=>`<option ${edit&&edit.tipo===t?'selected':''}>${t}</option>`).join('')}
      </select></div>
    </div>
    <div class="form-group"><label>Ensayo</label><select id="f-bit-ensayo">
      ${ensDisp.map(e=>`<option value="${e.id}" ${edit&&edit.ensayoId===e.id?'selected':''}>${e.codigo} · ${e.finca}</option>`).join('')}
    </select></div>
    <div class="form-group"><label>Descripción de la actividad</label>
      <textarea id="f-bit-desc" rows="4" placeholder="Describe qué se hizo, condiciones observadas, productos usados, dosis, etc.">${edit?edit.descripcion:''}</textarea></div>
    <div class="form-group"><label>Responsable</label><input id="f-bit-resp" value="${edit?edit.responsable:session.nombre}"></div>
  `, ()=>{
    const fecha=val('f-bit-fecha'), tipo=val('f-bit-tipo'), ensayoId=parseInt(val('f-bit-ensayo')), desc=val('f-bit-desc'), resp=val('f-bit-resp');
    if(!fecha||!desc.trim()){ showToast('error','Faltan campos','La fecha y la descripción son obligatorias.'); return false; }
    if(edit){ Object.assign(edit,{fecha,tipo,ensayoId,descripcion:desc,responsable:resp}); showToast('success','Entrada actualizada',tipo); }
    else{ BITACORA.push({id:nextId(BITACORA),fecha,tipo,ensayoId,descripcion:desc,responsable:resp,adjunto:null}); showToast('success','Entrada registrada',tipo+' · '+fecha); }
    renderBitacoraTable();
    return true;
  });
}
function deleteBitacora(id){
  if(!confirm('¿Eliminar esta entrada de la bitácora?')) return;
  BITACORA=BITACORA.filter(b=>b.id!==id);
  renderBitacoraTable();
  showToast('warn','Entrada eliminada','');
}

let RESP_MUESTREADOR = {}; // key: `${asigId}-${parcela}-${campoId}` -> valor

function renderMuestreadorView(body){
  const asigs=ASIGNACIONES.filter(a=>a.usuarioId===session.id&&a.estado==='Activo');

      const inputCols = form.campos.map(c=>{
        const key=`${a.id}-${parcela}-${c.id}`;

        const inputId=`mc-${a.id}-${parcela.replace(/\W/g,'_')}-${c.id}`;
        let ctrl='';
        if(c.tipo==='numero')
          ctrl=`<input type="number" step="0.01" class="mtr-input" id="${inputId}" value="${curVal}" placeholder="—" onchange="mtrSave('${key}',this.value)">`;

        else
          ctrl=`<input type="text" class="mtr-input" id="${inputId}" value="${curVal}" placeholder="—" onchange="mtrSave('${key}',this.value)">`;
        return `<td class="mtr-cell">${ctrl}</td>`;
      }).join('');
      return `<tr>
        <td style="font-weight:700;font-size:12px;white-space:nowrap;">
          <i class="fa-solid fa-map-pin" style="color:var(--naranja);margin-right:4px;font-size:10px;"></i>${parcela}

        </td>
        ${inputCols}
        <td style="text-align:center;">
          <button class="btn btn-primary btn-sm" onclick="mtrGuardarFila(${a.id},'${parcela}',${JSON.stringify(form.campos)})" title="Guardar parcela">

    }).join('');

    return `<div class="form-card" style="overflow:hidden;">
      <div class="form-card-head">

          <div style="font-size:15px;font-weight:700;">${form.nombre}</div>

function muestreadorParcelaCompleta(asigId, parcela, campos){
  return campos.filter(c=>c.requerido).every(c=>{
    const key=`${asigId}-${parcela}-${c.id}`;
    return !!(RESP_MUESTREADOR[key]||'').toString().trim();
  });
}

function mtrSave(key, value){
  RESP_MUESTREADOR[key]=value;
}

function mtrGuardarFila(asigId, parcela, campos){
  // Leer valores actuales del DOM
  campos.forEach(c=>{
    const inputId=`mc-${asigId}-${parcela.replace(/\W/g,'_')}-${c.id}`;
    const el=document.getElementById(inputId);
    if(el) RESP_MUESTREADOR[`${asigId}-${parcela}-${c.id}`]=el.value||'';
  });
  const faltantes=campos.filter(c=>c.requerido&&!(RESP_MUESTREADOR[`${asigId}-${parcela}-${c.id}`]||'').toString().trim());
  if(faltantes.length){
    showToast('warn','Campos requeridos',`Completa: ${faltantes.map(c=>c.label).join(', ')}`);
    return;
  }
  showToast('success','Parcela guardada',`${parcela} · ${new Date().toLocaleTimeString('es-GT')}`);
  renderFormulariosPage();
}

function mtrGuardarTodo(asigId, campos){
  const asig=ASIGNACIONES.find(a=>a.id===asigId); if(!asig) return;
  // Leer todos los inputs del DOM primero
  asig.parcelas.forEach(parcela=>{
    campos.forEach(c=>{
      const inputId=`mc-${asigId}-${parcela.replace(/\W/g,'_')}-${c.id}`;
      const el=document.getElementById(inputId);
      if(el) RESP_MUESTREADOR[`${asigId}-${parcela}-${c.id}`]=el.value||'';
    });
  });
  const incompletas=asig.parcelas.filter(p=>!muestreadorParcelaCompleta(asigId,p,campos));
  if(incompletas.length){
    showToast('warn','Parcelas incompletas',`Faltan campos requeridos en: ${incompletas.join(', ')}`);
  } else {
    showToast('success','Todo guardado',`${asig.parcelas.length} parcelas registradas correctamente`);
  }
  renderFormulariosPage();
}

function mgCascadaEnsayo(restore=false){
  const proyId = parseInt(document.getElementById('mg-proyecto')?.value)||null;
  const ensSel = document.getElementById('mg-ensayo'); if(!ensSel) return;
  if(!proyId){ ensSel.innerHTML='<option value="">— Seleccionar proyecto primero —</option>'; mgToggleAdd(false); return; }
  const ensayos = ENSAYOS.filter(e=>e.proyectoId===proyId);
  ensSel.innerHTML = '<option value="">— Seleccionar ensayo —</option>' +
    ensayos.map(e=>`<option value="${e.id}">${e.codigo} · ${e.finca} / ${e.lote}</option>`).join('');
  if(restore && muestrasSession.ensayoId){ ensSel.value = muestrasSession.ensayoId; }
  mgActualizarIds();
}

function mgGetContext(){
  const proyId = parseInt(document.getElementById('mg-proyecto')?.value)||null;
  const ensId  = parseInt(document.getElementById('mg-ensayo')?.value)||null;
  const fecha  = document.getElementById('mg-fecha')?.value||new Date().toISOString().slice(0,10);
  const resp   = document.getElementById('mg-responsable')?.value||'';
  return {proyId, ensId, fecha, resp};
}

function mgGenerarId(proyId, ensId, fecha, num){
  const proy = PROYECTOS.find(p=>p.id===proyId);
  const ens  = ENSAYOS.find(e=>e.id===ensId);
  if(!proy||!ens) return '—';
  const pCod = (proy.codigo||'PRY000').replace(/[^A-Z0-9]/gi,'').toUpperCase().slice(0,6);
  const eCod = (ens.codigo||'ENS000').replace(/[^A-Z0-9]/gi,'').toUpperCase().slice(0,6);
  const fCod = fecha.replace(/-/g,'');
  const nCod = String(num).padStart(4,'0');
  return `${pCod}-${eCod}-${fCod}-${nCod}`;
}

function mgActualizarIds(){
  const {proyId,ensId,fecha} = mgGetContext();
  const ready = !!(proyId && ensId && fecha);
  mgToggleAdd(ready);

  // Update ID preview
  const previewWrap = document.getElementById('mg-id-preview');
  const previewText = document.getElementById('mg-id-preview-text');
  if(previewWrap && previewText){
    if(ready){
      previewText.innerHTML = `<i class="fa-solid fa-barcode"></i>${mgGenerarId(proyId,ensId,fecha,1).replace(/\d{4}$/,'XXXX')}`;
      previewWrap.style.display='block';
    } else {
      previewWrap.style.display='none';
    }
  }

  // Refresh all existing row IDs
  const tbody = document.getElementById('mg-tbody'); if(!tbody) return;
  tbody.querySelectorAll('tr[data-row]').forEach((tr,i)=>{
    const idCell = tr.querySelector('.row-id-cell');
    const numInput = tr.querySelector('.row-num');
    const num = parseInt(numInput?.value)||i+1;
    if(idCell) idCell.textContent = ready ? mgGenerarId(proyId,ensId,fecha,num) : '—';
  });

  // Update parcelas and tratamientos dropdowns if ensayo changed
  if(ensId){
    const parcelas = PARCELAS.filter(p=>p.ensayoId===ensId);
    const trats    = TRATAMIENTOS.filter(t=>t.ensayoId===ensId);
    tbody.querySelectorAll('tr[data-row]').forEach(tr=>{
      const parcSel = tr.querySelector('.row-parcela');
      const tratSel = tr.querySelector('.row-trat');
      if(parcSel && parcelas.length){
        const cur = parcSel.value;
        parcSel.innerHTML = '<option value="">—</option>' + parcelas.map(p=>`<option value="${p.codigo}" ${p.codigo===cur?'selected':''}>${p.codigo}</option>`).join('');
      }
      if(tratSel && trats.length){
        const cur = tratSel.value;
        tratSel.innerHTML = '<option value="">—</option>' + trats.map(t=>`<option value="${t.codigo}" ${t.codigo===cur?'selected':''}>${t.codigo} — ${t.descripcion||''}</option>`).join('');
      }
    });
  }
}

function mgToggleAdd(enabled){

let mgRowCounter = 0;

function mgAgregarFila(){
  const {proyId,ensId,fecha} = mgGetContext();
  if(!proyId||!ensId||!fecha){ showToast('warn','Información incompleta','Selecciona proyecto, ensayo y fecha primero.'); return; }

  const tbody = document.getElementById('mg-tbody'); if(!tbody) return;
  // Remove empty-state row
  const emptyRow = document.getElementById('mg-empty-row');
  if(emptyRow) emptyRow.remove();

  mgRowCounter++;
  const rowIdx = tbody.querySelectorAll('tr[data-row]').length + 1;
  const idStr  = mgGenerarId(proyId,ensId,fecha,rowIdx);

  const parcelas = PARCELAS.filter(p=>p.ensayoId===ensId);
  const trats    = TRATAMIENTOS.filter(t=>t.ensayoId===ensId);

  const tr = document.createElement('tr');
  tr.setAttribute('data-row', mgRowCounter);
  tr.innerHTML = `
    <td style="text-align:center;font-size:12px;color:var(--texto-suave);font-weight:600;">${rowIdx}</td>
    <td><span class="id-cell row-id-cell" title="ID generado automáticamente — no editable"><i class="fa-solid fa-barcode" style="opacity:.6;"></i><span>${idStr}</span></span></td>
    <td><input type="date" class="sample-td-input row-fecha" value="${fecha}" style="min-width:120px;"></td>
    <td><input type="number" class="sample-td-input row-num" value="${rowIdx}" min="1" style="min-width:60px;width:60px;" onchange="mgRecalcId(this)"></td>
    <td>
      <select class="sample-td-select row-parcela">
        <option value="">—</option>
        ${parcelas.map(p=>`<option value="${p.codigo}">${p.codigo}</option>`).join('')}
        ${!parcelas.length?'<option value="Manual">Ingresar manual</option>':''}
      </select>
    </td>
    <td>
      <select class="sample-td-select row-trat">
        <option value="">—</option>
        ${trats.map(t=>`<option value="${t.codigo}">${t.codigo} — ${t.descripcion||''}</option>`).join('')}
        ${!trats.length?'<option value="Manual">Ingresar manual</option>':''}
      </select>
    </td>
    <td><input type="text" class="sample-td-input row-obs" placeholder="Observaciones..." style="min-width:140px;"></td>
    <td><button class="del-row-btn" onclick="mgEliminarFila(this)" title="Eliminar fila"><i class="fa-solid fa-trash"></i></button></td>
  `;
  tbody.appendChild(tr);
  mgActualizarCounter();
}

function mgRecalcId(input){
  const tr   = input.closest('tr[data-row]');
  const {proyId,ensId,fecha} = mgGetContext();
  const num  = parseInt(input.value)||1;
  const cell = tr?.querySelector('.row-id-cell span');
  if(cell && proyId && ensId) cell.textContent = mgGenerarId(proyId,ensId,fecha,num);
}

function mgEliminarFila(btn){
  const tr = btn.closest('tr[data-row]'); if(!tr) return;
  tr.remove();
  // Renumber
  const tbody = document.getElementById('mg-tbody');
  if(!tbody) return;
  const rows = tbody.querySelectorAll('tr[data-row]');
  if(!rows.length){
    const empty = document.createElement('tr');
    empty.id='mg-empty-row';
    empty.innerHTML=`<td colspan="8" style="text-align:center;padding:32px;color:var(--texto-suave);font-size:13px;">
      <i class="fa-solid fa-flask-vial" style="font-size:28px;display:block;margin-bottom:8px;opacity:.35;"></i>
      No hay filas. Agrega muestras con el botón de abajo.</td>`;
    tbody.appendChild(empty);
  }
  rows.forEach((r,i)=>{
    r.cells[0].textContent = i+1;
    const numInput = r.querySelector('.row-num');
    if(numInput && parseInt(numInput.value)===(i+2)) numInput.value = i+1;
  });
  mgActualizarCounter();
}

function mgActualizarCounter(){
  const tbody = document.getElementById('mg-tbody');
  const n = tbody ? tbody.querySelectorAll('tr[data-row]').length : 0;
  const el = document.getElementById('mg-counter');
  if(el) el.textContent = n===0?'0 filas':`${n} muestra${n===1?'':'s'}`;
}

function mgGuardar(){
  const {proyId,ensId,fecha,resp} = mgGetContext();
  if(!proyId||!ensId||!fecha){ showToast('error','Faltan datos','Selecciona proyecto, ensayo y fecha.'); return; }
  const tbody = document.getElementById('mg-tbody');
  const rows  = tbody ? tbody.querySelectorAll('tr[data-row]') : [];
  if(!rows.length){ showToast('warn','Sin muestras','Agrega al menos una muestra antes de guardar.'); return; }

  const nuevas = [];
  let hasError = false;
  rows.forEach((tr,i)=>{
    const idText  = tr.querySelector('.row-id-cell span')?.textContent||'—';
    const rowFecha= tr.querySelector('.row-fecha')?.value||fecha;
    const num     = parseInt(tr.querySelector('.row-num')?.value)||i+1;
    const parcela = tr.querySelector('.row-parcela')?.value||'—';
    const trat    = tr.querySelector('.row-trat')?.value||'—';
    const obs     = tr.querySelector('.row-obs')?.value||'';
    // Check duplicate ID in session
    if(nuevas.find(m=>m.idMuestra===idText)){ hasError=true; return; }
    nuevas.push({
      id: nextId([...MUESTRAS_LAB,...nuevas]),
      idMuestra: idText,
      fecha: rowFecha,
      numMuestra: num,
      proyectoId: proyId,
      ensayoId: ensId,
      finca: ENSAYOS.find(e=>e.id===ensId)?.finca||'—',
      lote: ENSAYOS.find(e=>e.id===ensId)?.lote||'—',
      tratamiento: trat,
      parcela,
      obs,
      tipo: 'Campo',
      estado: 'Recibida',
      solicitante: resp||session.nombre,
      analistas: '—',
      resultado: '—',
      fechaResultado: null,
    });
  });

  if(hasError){ showToast('error','IDs duplicados','Revisa los números de muestra para evitar IDs repetidos.'); return; }

  MUESTRAS_LAB.push(...nuevas);
  showToast('success',`${nuevas.length} muestra${nuevas.length!==1?'s':''} guardada${nuevas.length!==1?'s':''}`,`Proyecto ${PROYECTOS.find(p=>p.id===proyId)?.codigo}`);

  // Mostrar panel de etiquetas
  mgMostrarEtiquetas(nuevas);

  // Reset tabla
  if(tbody) tbody.innerHTML = `<tr id="mg-empty-row"><td colspan="8" style="text-align:center;padding:32px;color:var(--texto-suave);font-size:13px;">
    <i class="fa-solid fa-check-circle" style="font-size:28px;display:block;margin-bottom:8px;color:var(--verde);opacity:.8;"></i>
    Muestras guardadas. Puedes agregar más o imprimir las etiquetas arriba.</td></tr>`;
  mgActualizarCounter();
}

function mgMostrarEtiquetas(muestras){
  const panel = document.getElementById('mg-etiquetas-panel');
  const grid  = document.getElementById('mg-etiquetas-grid');
  if(!panel||!grid) return;
  panel.style.display='block';
  grid.innerHTML = '';

  muestras.forEach(m=>{
    const div = document.createElement('div');
    div.className='etiqueta';
    div.innerHTML = `
      <div class="etiqueta-qr" id="qr-${m.id}"></div>
      <div class="etiqueta-id">${m.idMuestra}</div>
      <div class="etiqueta-logo">CENGICAÑA · SIGEC</div>`;
    grid.appendChild(div);
    // Generate QR
    try{
      new QRCode(document.getElementById('qr-'+m.id), {
        text: m.idMuestra,
        width: 90, height: 90,
        colorDark:'#1a3a08', colorLight:'#ffffff',
        correctLevel: QRCode.CorrectLevel.M
      });
    } catch(e){
      // QR library not available, show barcode placeholder
      document.getElementById('qr-'+m.id).innerHTML=
        `<div style="font-family:monospace;font-size:8px;word-break:break-all;color:#333;border:1px solid #ccc;padding:4px;border-radius:4px;width:90px;text-align:center;">${m.idMuestra}</div>`;
    }
  });

  panel.scrollIntoView({behavior:'smooth', block:'start'});
}

function mgLimpiarTodo(){
  if(!confirm('¿Limpiar toda la tabla? Los datos no guardados se perderán.')) return;
  const tbody=document.getElementById('mg-tbody'); if(!tbody) return;
  tbody.innerHTML=`<tr id="mg-empty-row"><td colspan="8" style="text-align:center;padding:32px;color:var(--texto-suave);font-size:13px;">
    <i class="fa-solid fa-flask-vial" style="font-size:28px;display:block;margin-bottom:8px;opacity:.35;"></i>
    No hay filas. Agrega muestras con el botón de abajo.</td></tr>`;
  const panel=document.getElementById('mg-etiquetas-panel');
  if(panel) panel.style.display='none';
  mgActualizarCounter();
}

// Ciclo de vida de la muestra
const CICLO_STEPS = ['Recibida','En análisis','Completado'];
function cicloIdx(estado){ return CICLO_STEPS.indexOf(estado); }

function renderConsultaMuestras(){
  // Populate selectors on first call
  const cqProy = document.getElementById('cq-proy');
  if(cqProy && cqProy.options.length<=1){
    const visProys=proyectosVisibles();
    cqProy.innerHTML='<option value="">Todos</option>'+visProys.map(p=>`<option value="${p.id}">${p.codigo} — ${p.nombre}</option>`).join('');
  }
  const cqEns = document.getElementById('cq-ensayo');
  const fProy = parseInt(document.getElementById('cq-proy')?.value)||null;
  if(cqEns){
    const ensOpts = fProy ? ENSAYOS.filter(e=>e.proyectoId===fProy) : ensayosVisibles();
    cqEns.innerHTML='<option value="">Todos</option>'+ensOpts.map(e=>`<option value="${e.id}">${e.codigo}</option>`).join('');
  }

  const q      = (document.getElementById('cq-id')?.value||'').trim().toUpperCase();
  const fEns   = parseInt(document.getElementById('cq-ensayo')?.value)||null;
  const fIni   = document.getElementById('cq-fecha-ini')?.value||'';
  const fFin   = document.getElementById('cq-fecha-fin')?.value||'';
  const fEst   = document.getElementById('cq-estado')?.value||'';
  const visIds = proyectosVisibles().map(p=>p.id);

  let muestras = MUESTRAS_LAB.filter(m=>visIds.includes(m.proyectoId));
  if(q)     muestras = muestras.filter(m=>m.idMuestra.toUpperCase().includes(q));
  if(fProy) muestras = muestras.filter(m=>m.proyectoId===fProy);
  if(fEns)  muestras = muestras.filter(m=>m.ensayoId===fEns);
  if(fIni)  muestras = muestras.filter(m=>m.fecha>=fIni);
  if(fFin)  muestras = muestras.filter(m=>m.fecha<=fFin);
  if(fEst)  muestras = muestras.filter(m=>m.estado===fEst);

  const resultDiv=document.getElementById('cq-results'); if(!resultDiv) return;
  if(!muestras.length){
    resultDiv.innerHTML=`<div style="text-align:center;padding:40px;color:var(--texto-suave);"><i class="fa-solid fa-magnifying-glass" style="font-size:28px;display:block;margin-bottom:8px;opacity:.35;"></i>Sin resultados para los filtros aplicados.</div>`;
    return;
  }

  const estClass={Completado:'tag-green','En análisis':'tag-yellow',Recibida:'tag-blue',Pendiente:'tag-gray','En proceso':'tag-yellow'};
  resultDiv.innerHTML = `<div style="font-size:12px;color:var(--texto-suave);margin-bottom:12px;">${muestras.length} muestra${muestras.length!==1?'s':''} encontrada${muestras.length!==1?'s':''}</div>` +
  muestras.map(m=>{
    const proy=PROYECTOS.find(p=>p.id===m.proyectoId);
    const ens=ENSAYOS.find(e=>e.id===m.ensayoId);
    const idx=cicloIdx(m.estado);
    const ciclo = CICLO_STEPS.map((s,i)=>`
      <div class="ciclo-step">
        <div class="ciclo-dot ${i<idx?'done':i===idx?'active':''}">
          <i class="fa-solid ${i===0?'fa-inbox':i===1?'fa-microscope':'fa-check'}"></i>
        </div>
        <div class="ciclo-lbl">${s}</div>
      </div>`).join('');
    return `<div class="result-card">
      <div class="result-card-head">
        <div>
          <span class="id-cell" style="margin-bottom:4px;display:inline-flex;"><i class="fa-solid fa-barcode"></i>${m.idMuestra}</span>
          <div style="font-size:11.5px;color:var(--texto-suave);margin-top:5px;">${proy?proy.codigo+' — '+proy.nombre:'—'}</div>
        </div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
          <span class="tag ${estClass[m.estado]||'tag-gray'}">${m.estado}</span>
          ${can('create_muestra')||session.rol==='administrador'?`<button class="btn btn-secondary btn-sm" onclick="openConsultaEdit(${m.id})"><i class="fa-solid fa-pen"></i> Actualizar estado</button>`:''}
        </div>
      </div>
      <div class="result-card-body">
        <div class="result-field"><b>Ensayo</b>${ens?ens.codigo:'—'}</div>
        <div class="result-field"><b>Fecha muestreo</b>${m.fecha}</div>
        <div class="result-field"><b>Finca / Lote</b>${m.finca||'—'} / ${m.lote||'—'}</div>
        <div class="result-field"><b>Parcela</b>${m.parcela||'—'}</div>
        <div class="result-field"><b>Tratamiento</b>${m.tratamiento||m.tratamiento||'—'}</div>
        <div class="result-field"><b>Solicitante</b>${m.solicitante||'—'}</div>
        ${m.obs?`<div class="result-field" style="grid-column:1/-1;"><b>Observaciones</b>${m.obs}</div>`:''}
        ${m.resultado&&m.resultado!=='—'?`<div class="result-field" style="grid-column:1/-1;background:#f5faef;border-radius:8px;padding:8px 12px;"><b>Resultado</b>${m.resultado}${m.fechaResultado?` <span style="color:var(--texto-suave);font-size:11px;">· ${m.fechaResultado}</span>`:''}</div>`:''}
      </div>
      <div style="padding:10px 18px 14px;">
        <div style="font-size:11px;font-weight:700;color:var(--texto-suave);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em;">Ciclo de la muestra</div>
        <div class="ciclo-timeline">${ciclo}</div>
      </div>
    </div>`;
  }).join('');
}

function openConsultaEdit(id){

  openModal(`Actualizar muestra ${m.idMuestra}`,`

    return true;

function processImportFile(file){
  const reader = new FileReader();
  reader.onload = function(evt){
    try{
      const wb = XLSX.read(evt.target.result, {type:'binary'});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
      if(!rows.length){ showToast('error','Archivo vacío','No se encontraron filas de datos.'); return; }
      importPreviewRows = rows;
      renderImportPreview(rows, file.name);
    }catch(err){
      showToast('error','No se pudo leer el archivo','Verifica que el formato sea .xlsx, .xls o .csv.');
    }
  };
  reader.readAsBinaryString(file);
}
