/* ---- Análisis estadístico con visualizaciones ---- */
function mean(arr){ return arr.reduce((a,b)=>a+b,0)/arr.length; }
function stdev(arr){ const m=mean(arr); return Math.sqrt(arr.reduce((a,b)=>a+(b-m)**2,0)/(arr.length-1||1)); }
function minArr(arr){ return Math.min(...arr); }
function maxArr(arr){ return Math.max(...arr); }
function median(arr){ const s=[...arr].sort((a,b)=>a-b); const m=Math.floor(s.length/2); return s.length%2?s[m]:(s[m-1]+s[m])/2; }
function q1(arr){ const s=[...arr].sort((a,b)=>a-b); return median(s.slice(0,Math.floor(s.length/2))); }
function q3(arr){ const s=[...arr].sort((a,b)=>a-b); return median(s.slice(Math.ceil(s.length/2))); }
function cv(arr){ const m=mean(arr); return m?((stdev(arr)/m)*100):0; }

const TRAT_COLORS = ['#73BC25','#1f6fbf','#FF6B00','#A3D300','#FFCC00','#c4471b','#7B2FBE','#00897B'];

function runStatAnalysis(){
  if(!can('run_analysis')){ showToast('error','Acceso denegado','Tu perfil no tiene acceso al módulo de análisis estadístico.'); return; }
  const ensayoIds = Array.from(document.querySelectorAll('.an-ensayo-chk:checked')).map(c=>parseInt(c.value));
  const variableId = parseInt(val('an-variable'));
  const motor = val('an-motor');
  const tipo = val('an-tipo');
  const variable = VARIABLES.find(v=>v.id===variableId);
  const resultDiv = document.getElementById('stat-result');

  if(!ensayoIds.length){ resultDiv.innerHTML=`<div class="deny-banner"><i class="fa-solid fa-triangle-exclamation"></i> Selecciona al menos un ensayo.</div>`; return; }
  if(!variable){ resultDiv.innerHTML=`<div class="deny-banner"><i class="fa-solid fa-triangle-exclamation"></i> No hay variables de tipo "${tipo}" disponibles.</div>`; return; }

  const parcelas = PARCELAS.filter(p=>ensayoIds.includes(p.ensayoId));
  const data = parcelas.map(p=>{
    const evs = EVALUACIONES.filter(e=>e.parcelaId===p.id && e.variableId===variableId);
    return {parcela:p, valores:evs.map(e=>e.valor), fechas:evs.map(e=>e.fecha)};
  }).filter(d=>d.valores.length);

  const grupos = {};
  const rawRows = []; // para tabla de datos crudos
  data.forEach(d=>{
    const code = d.parcela.tratamientoCodigo;
    (grupos[code]=grupos[code]||[]).push(...d.valores);
    d.valores.forEach((v,i)=> rawRows.push({
      ensayo: ENSAYOS.find(e=>e.id===d.parcela.ensayoId)?.codigo||'—',
      trat:code, rep:d.parcela.repeticion, parcela:d.parcela.codigo,
      fecha:d.fechas[i]||'—', valor:v
    }));
  });
  const tratCodes = Object.keys(grupos).sort();
  if(tratCodes.length<2){ resultDiv.innerHTML=`<div class="deny-banner"><i class="fa-solid fa-triangle-exclamation"></i> Necesitas datos de al menos 2 tratamientos.</div>`; return; }

  /* ---- descriptiva ---- */
  const medias = tratCodes.map((t,i)=>({
    trat:t, n:grupos[t].length, media:mean(grupos[t]), de:stdev(grupos[t]),
    min:minArr(grupos[t]), max:maxArr(grupos[t]),
    q1:q1(grupos[t]), med:median(grupos[t]), q3:q3(grupos[t]),
    cv:cv(grupos[t]), color:TRAT_COLORS[i%TRAT_COLORS.length]
  }));
  medias.sort((a,b)=>b.media-a.media);

  /* ---- ANOVA simulada ---- */
  const grandMean = mean(Object.values(grupos).flat());
  const ssBetween = medias.reduce((s,g)=>s+g.n*(g.media-grandMean)**2,0);
  const ssWithin  = tratCodes.reduce((s,t)=>s+grupos[t].reduce((ss,v)=>ss+(v-mean(grupos[t]))**2,0),0);
  const dfBetween = tratCodes.length-1, dfWithin = Object.values(grupos).flat().length - tratCodes.length;
  const msB=ssBetween/dfBetween, msW=ssWithin/(dfWithin||1);
  const fValue=(msW>0)?(msB/msW):0;
  const pValue=fValue>4?(Math.random()*0.04+0.001):(Math.random()*0.5+0.06);
  const sig=pValue<0.05;
  const letras='abcdefg';
  medias.forEach((g,i)=>{ g.letra=sig?letras[i]:'a'; });

  const ensayosUsados=ensayoIds.map(id=>ENSAYOS.find(e=>e.id===id)?.codigo).filter(Boolean);
  window.lastAnalysis={ensayoIds,ensayosUsados,tipo,variable,motor,medias,fValue,pValue,sig,dfBetween,dfWithin};

  /* ========== SVG: Gráfico de barras con barras de error ========== */
  const svgW=520, svgH=220, padL=60, padB=50, padT=20, padR=20;
  const cW=svgW-padL-padR, cH=svgH-padT-padB;
  const allVals=[...medias.map(g=>g.media+g.de), ...medias.map(g=>Math.max(0,g.media-g.de))];
  const yMax=Math.max(...allVals)*1.18; const yMin=Math.min(...medias.map(g=>g.media-g.de),0)*0.9;
  const yRange=yMax-yMin||1;
  const yScale=v=>padT+cH*(1-(v-yMin)/yRange);
  const barW=Math.min(48,(cW/medias.length)*0.55);
  const xPos=i=>padL+(i+0.5)*(cW/medias.length);

  const yTicks=[0,0.25,0.5,0.75,1].map(f=>yMin+f*yRange);
  const gridLines=yTicks.map(v=>`
    <line x1="${padL}" x2="${svgW-padR}" y1="${yScale(v).toFixed(1)}" y2="${yScale(v).toFixed(1)}" stroke="#e3e7e1" stroke-width="0.8"/>
    <text x="${padL-6}" y="${(yScale(v)+4).toFixed(1)}" text-anchor="end" font-size="10" fill="#8a9a80">${v.toFixed(1)}</text>`).join('');
  const bars=medias.map((g,i)=>{
    const bTop=yScale(g.media), bBot=yScale(yMin>0?yMin:0);
    const errTop=yScale(g.media+g.de), errBot=yScale(Math.max(yMin,g.media-g.de));
    const x=xPos(i);
    return `
      <rect x="${(x-barW/2).toFixed(1)}" y="${bTop.toFixed(1)}" width="${barW}" height="${(bBot-bTop).toFixed(1)}" fill="${g.color}" opacity="0.82" rx="3"/>
      <line x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${errTop.toFixed(1)}" y2="${errBot.toFixed(1)}" stroke="${g.color}" stroke-width="1.8"/>
      <line x1="${(x-6).toFixed(1)}" x2="${(x+6).toFixed(1)}" y1="${errTop.toFixed(1)}" y2="${errTop.toFixed(1)}" stroke="${g.color}" stroke-width="1.8"/>
      <line x1="${(x-6).toFixed(1)}" x2="${(x+6).toFixed(1)}" y1="${errBot.toFixed(1)}" y2="${errBot.toFixed(1)}" stroke="${g.color}" stroke-width="1.8"/>
      <text x="${x.toFixed(1)}" y="${(bTop-5).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="600" fill="${g.color}">${g.media.toFixed(1)}<tspan font-size="9" fill="#888"> ${g.letra}</tspan></text>
      <text x="${x.toFixed(1)}" y="${(svgH-padB+14).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="600" fill="#3a4a28">${g.trat}</text>`;
  }).join('');
  const yAxisLabel=`<text x="13" y="${(padT+cH/2).toFixed(1)}" text-anchor="middle" font-size="10" fill="#6a7a60" transform="rotate(-90,13,${(padT+cH/2).toFixed(1)})">${variable.nombre} (${variable.unidad})</text>`;
  const barChartSVG=`<svg width="100%" viewBox="0 0 ${svgW} ${svgH}" style="overflow:visible;">${gridLines}${bars}${yAxisLabel}
    <line x1="${padL}" x2="${padL}" y1="${padT}" y2="${svgH-padB}" stroke="#c0c8b8" stroke-width="1"/>
    <line x1="${padL}" x2="${svgW-padR}" y1="${(svgH-padB).toFixed(1)}" y2="${(svgH-padB).toFixed(1)}" stroke="#c0c8b8" stroke-width="1"/>
    <text x="${(svgW/2).toFixed(1)}" y="${svgH-2}" text-anchor="middle" font-size="10" fill="#6a7a60">Tratamiento</text>
  </svg>`;

  /* ========== SVG: Boxplot ========== */
  const bpW=520, bpH=180, bpPadL=60, bpPadB=36, bpPadT=20, bpPadR=20;
  const bpCW=bpW-bpPadL-bpPadR, bpCH=bpH-bpPadT-bpPadB;
  const allBpVals=Object.values(grupos).flat();
  const bpYMax=maxArr(allBpVals)*1.08, bpYMin=minArr(allBpVals)*0.92;
  const bpYRange=bpYMax-bpYMin||1;
  const bpYS=v=>bpPadT+bpCH*(1-(v-bpYMin)/bpYRange);
  const bpXPos=i=>bpPadL+(i+0.5)*(bpCW/medias.length);
  const bpW2=Math.min(36,(bpCW/medias.length)*0.45);
  const bpGrids=[0,0.25,0.5,0.75,1].map(f=>bpYMin+f*bpYRange).map(v=>`
    <line x1="${bpPadL}" x2="${bpW-bpPadR}" y1="${bpYS(v).toFixed(1)}" y2="${bpYS(v).toFixed(1)}" stroke="#e3e7e1" stroke-width="0.7"/>
    <text x="${bpPadL-5}" y="${(bpYS(v)+3).toFixed(1)}" text-anchor="end" font-size="9" fill="#8a9a80">${v.toFixed(1)}</text>`).join('');
  const boxes=medias.map((g,i)=>{
    const x=bpXPos(i);
    const q1y=bpYS(g.q1), q3y=bpYS(g.q3), medy=bpYS(g.med), miny=bpYS(g.min), maxy=bpYS(g.max);
    return `
      <line x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${maxy.toFixed(1)}" y2="${miny.toFixed(1)}" stroke="${g.color}" stroke-width="1.2" stroke-dasharray="3 2"/>
      <line x1="${(x-bpW2/2-3).toFixed(1)}" x2="${(x+bpW2/2+3).toFixed(1)}" y1="${maxy.toFixed(1)}" y2="${maxy.toFixed(1)}" stroke="${g.color}" stroke-width="1.5"/>
      <line x1="${(x-bpW2/2-3).toFixed(1)}" x2="${(x+bpW2/2+3).toFixed(1)}" y1="${miny.toFixed(1)}" y2="${miny.toFixed(1)}" stroke="${g.color}" stroke-width="1.5"/>
      <rect x="${(x-bpW2/2).toFixed(1)}" y="${q3y.toFixed(1)}" width="${bpW2}" height="${(q1y-q3y).toFixed(1)}" fill="${g.color}" opacity="0.18" stroke="${g.color}" stroke-width="1.5" rx="2"/>
      <line x1="${(x-bpW2/2).toFixed(1)}" x2="${(x+bpW2/2).toFixed(1)}" y1="${medy.toFixed(1)}" y2="${medy.toFixed(1)}" stroke="${g.color}" stroke-width="2.2"/>
      <text x="${x.toFixed(1)}" y="${(bpH-bpPadB+14).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="600" fill="#3a4a28">${g.trat}</text>`;
  }).join('');
  const boxplotSVG=`<svg width="100%" viewBox="0 0 ${bpW} ${bpH}" style="overflow:visible;">${bpGrids}${boxes}
    <text x="13" y="${(bpPadT+bpCH/2).toFixed(1)}" text-anchor="middle" font-size="9" fill="#6a7a60" transform="rotate(-90,13,${(bpPadT+bpCH/2).toFixed(1)})">${variable.unidad}</text>
    <line x1="${bpPadL}" x2="${bpPadL}" y1="${bpPadT}" y2="${bpH-bpPadB}" stroke="#c0c8b8" stroke-width="1"/>
    <line x1="${bpPadL}" x2="${bpW-bpPadR}" y1="${(bpH-bpPadB).toFixed(1)}" y2="${(bpH-bpPadB).toFixed(1)}" stroke="#c0c8b8" stroke-width="1"/>
  </svg>`;

  /* ========== Tabla de datos crudos ========== */
  const rawHtml=rawRows.map(r=>`<tr>
    <td><span class="tag tag-blue">${r.trat}</span></td>
    <td>${r.rep}</td><td>${r.parcela}</td><td>${r.ensayo}</td>
    <td>${r.fecha}</td><td><b>${r.valor} ${variable.unidad}</b></td>
  </tr>`).join('');

  /* ========== Contexto agronómico ========== */
  const ensayoRef=ENSAYOS.find(e=>e.id===ensayoIds[0]);
  const proyRef=PROYECTOS.find(p=>p.id===ensayoRef?.proyectoId);
  const mejor=medias[0], peor=medias[medias.length-1];
  const diff=(mejor.media-peor.media).toFixed(2);
  const diffPct=peor.media?((mejor.media-peor.media)/peor.media*100).toFixed(1):'—';
  const cvAlerta=medias.some(g=>g.cv>15);

  /* ========== RENDER ========== */
  resultDiv.innerHTML = `
  <!-- Cabecera del análisis -->
  <div style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px;">
    <div>
      <div style="font-size:12px;color:var(--texto-suave);margin-bottom:4px;">
        Ensayos: ${ensayosUsados.map(c=>`<span class="tag tag-blue" style="margin-right:4px;">${c}</span>`).join('')}
        · Tipo: <span class="tag ${tipo==='Cosecha'?'tag-orange':'tag-green'}">${tipo}</span>
        · Motor: <b>${motor==='python'?'Python · Tukey HSD':'R · agricolae HSD'}</b>
      </div>
      <div style="font-size:15px;font-weight:700;">${variable.nombre} <span style="font-size:13px;font-weight:400;color:var(--texto-suave);">[${variable.unidad}]</span></div>
      ${proyRef?`<div style="font-size:12px;color:var(--texto-suave);margin-top:2px;">${proyRef.codigo} · ${proyRef.nombre}</div>`:''}
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="btn btn-secondary btn-sm" onclick="exportarAnalisisExcel()"><i class="fa-solid fa-file-excel"></i> Exportar tabla</button>
    </div>
  </div>

  <!-- KPIs ANOVA -->
  <div class="stat-summary-grid" style="margin-bottom:18px;">
    <div class="stat-box"><div class="v">${fValue.toFixed(2)}</div><div class="l">Valor F</div></div>
    <div class="stat-box"><div class="v" style="color:${sig?'#4d8a13':'#c4500f'}">${pValue.toFixed(4)}</div><div class="l">p-valor (α=0.05)</div></div>
    <div class="stat-box"><div class="v">${dfBetween} / ${dfWithin}</div><div class="l">G.L. entre / dentro</div></div>
    <div class="stat-box"><div class="v">${sig?'<span style="color:#4d8a13;">Sí ✓</span>':'<span style="color:#c4500f;">No ✗</span>'}</div><div class="l">Diferencia sig.</div></div>
    <div class="stat-box"><div class="v">${mejor.trat}</div><div class="l">Mejor tratamiento</div></div>
    <div class="stat-box"><div class="v">${diff} ${variable.unidad}</div><div class="l">Rango entre extremos</div></div>
  </div>

  <!-- Tabla de medias y prueba de comparación -->
  <div class="stat-section">
    <div class="stat-section-title"><i class="fa-solid fa-table"></i>Comparación de medias · Prueba de Tukey (α = 0.05)</div>
    <div class="data-table-wrap">
    <table><thead><tr>
      <th>Trat.</th><th>n</th><th>Media (${variable.unidad})</th><th>D.E.</th><th>CV (%)</th>
      <th>Mín.</th><th>Mediana</th><th>Máx.</th><th>Grupo Tukey</th>
    </tr></thead><tbody>
    ${medias.map(g=>`<tr>
      <td><span style="display:inline-flex;align-items:center;gap:6px;"><span style="width:10px;height:10px;border-radius:2px;background:${g.color};display:inline-block;"></span><b>${g.trat}</b></span></td>
      <td>${g.n}</td>
      <td><b>${g.media.toFixed(2)}</b></td>
      <td>±${g.de.toFixed(2)}</td>
      <td><span class="${g.cv>15?'tag tag-orange':'tag tag-green'}">${g.cv.toFixed(1)}%</span></td>
      <td>${g.min.toFixed(2)}</td>
      <td>${g.med.toFixed(2)}</td>
      <td>${g.max.toFixed(2)}</td>
      <td><span class="tag tag-blue" style="font-size:13px;padding:4px 12px;">${g.letra}</span></td>
    </tr>`).join('')}
    </tbody></table>
    </div>
    <p style="font-size:11px;color:var(--texto-suave);margin-top:8px;">Tratamientos con la misma letra no difieren significativamente (Tukey, α=0.05). CV >15% puede indicar alta variabilidad experimental.</p>
  </div>

  <!-- Gráfico de barras con barras de error -->
  <div class="stat-section">
    <div class="stat-section-title"><i class="fa-solid fa-chart-bar"></i>Medias por tratamiento ± desviación estándar</div>
    <div class="chart-svg-wrap">${barChartSVG}</div>
    <p style="font-size:11px;color:var(--texto-suave);margin-top:6px;">Las barras de error representan ±1 desviación estándar. La letra sobre cada barra indica el grupo de Tukey.</p>
  </div>

  <!-- Boxplot -->
  <div class="stat-section">
    <div class="stat-section-title"><i class="fa-solid fa-chart-gantt"></i>Distribución de valores por tratamiento (Boxplot)</div>
    <div class="chart-svg-wrap">${boxplotSVG}</div>
    <p style="font-size:11px;color:var(--texto-suave);margin-top:6px;">La caja contiene el 50% central de los datos (Q1–Q3). La línea gruesa es la mediana. Los bigotes muestran el rango completo.</p>
  </div>

  <!-- Tabla de datos crudos -->
  <div class="stat-section">
    <div class="stat-section-title"><i class="fa-solid fa-list"></i>Datos crudos del análisis (${rawRows.length} observaciones)</div>
    <div class="data-table-wrap" style="max-height:240px;overflow-y:auto;border:1px solid var(--borde);border-radius:8px;">
    <table><thead><tr><th>Trat.</th><th>Rep.</th><th>Parcela</th><th>Ensayo</th><th>Fecha</th><th>Valor</th></tr></thead>
    <tbody>${rawHtml}</tbody></table>
    </div>
  </div>

  <!-- Contexto agronómico para caña -->
  <div class="context-box" style="margin-top:18px;">
    <b><i class="fa-solid fa-seedling" style="margin-right:6px;"></i>Interpretación agronómica · Caña de azúcar</b>
    ${sig
      ? `El tratamiento <b>${mejor.trat}</b> obtuvo la mayor media (${mejor.media.toFixed(2)} ${variable.unidad}), superando a <b>${peor.trat}</b> en <b>${diff} ${variable.unidad}</b> (${diffPct}%). Esta diferencia es estadísticamente significativa, lo que indica que el factor evaluado tiene efecto real sobre <b>${variable.nombre}</b>.`
      : `No se detectó diferencia estadística entre tratamientos en <b>${variable.nombre}</b>. Aunque <b>${mejor.trat}</b> presentó la media más alta (${mejor.media.toFixed(2)} ${variable.unidad}), la variabilidad dentro de los tratamientos no permite concluir superioridad real.`}
    ${cvAlerta ? '<br><span style="color:#c4500f;font-weight:600;">⚠ Uno o más tratamientos presenta CV >15%. Revisar homogeneidad de parcelas o posibles errores de medición.</span>' : ''}
    <br>Motor utilizado: <b>${motor==='python'?'Python · scipy.stats + statsmodels':'R · aov + agricolae'}</b> (simulado en prototipo).
  </div>`;
}

/* ---- Reporte con IA (simulado) ---- */
function generarReporteIA(){
  const btn = document.getElementById('ai-btn');
  const resultDiv = document.getElementById('ai-result');
  if(!window.lastAnalysis){ showToast('warn','Ejecuta el análisis primero','Corre el análisis estadístico antes de generar el reporte con IA.'); return; }
  const a = window.lastAnalysis;
  const instr = val('ai-instrucciones');
  const ensayo = ENSAYOS.find(e=>e.id===a.ensayoIds[0]);
  const proy = PROYECTOS.find(p=>p.id===ensayo.proyectoId);
  const mejor = a.medias[0];

  btn.disabled = true;
  btn.innerHTML = `<i class="fa-solid fa-spinner spin"></i> Generando reporte...`;
  resultDiv.innerHTML = '';

  setTimeout(()=>{
    btn.disabled = false;
    btn.innerHTML = `<i class="fa-solid fa-wand-magic-sparkles"></i> Generar reporte con IA`;

  const texto = `INFORME TÉCNICO AUTOMÁTICO — ${a.ensayosUsados.join(', ')}
Proyecto: ${proy.nombre} (${proy.codigo})
Tipo de evaluación: ${a.tipo}
Variable analizada: ${a.variable.nombre} [${a.variable.unidad}]

1. Resumen estadístico (ANOVA)
Se evaluaron ${a.medias.length} tratamientos${a.ensayosUsados.length>1?` combinando datos de ${a.ensayosUsados.length} ensayos (${a.ensayosUsados.join(', ')})`:''} mediante análisis de varianza (ANOVA) con prueba de separación de medias de Tukey (α=0.05).
Valor F: ${a.fValue.toFixed(2)} | p-valor: ${a.pValue.toFixed(4)} | G.L.: ${a.dfBetween}/${a.dfWithin}
${a.sig?'Se detectó diferencia estadísticamente significativa entre tratamientos.':'No se detectó diferencia estadísticamente significativa entre tratamientos.'}

2. Comparación de medias (Tukey α=0.05)
${a.medias.map(g=>`- ${g.trat}: media ${g.media.toFixed(2)} ${a.variable.unidad}, DE ±${g.de.toFixed(2)}, CV ${g.cv.toFixed(1)}%, n=${g.n} → Grupo Tukey: "${g.letra}"`).join('\n')}

3. Conclusión
${a.sig
  ? `El tratamiento ${mejor.trat} presentó el mejor desempeño en ${a.variable.nombre.toLowerCase()}, con una media de ${mejor.media.toFixed(2)} ${a.variable.unidad}, superando estadísticamente a los demás tratamientos. Rango entre extremos: ${(mejor.media-a.medias[a.medias.length-1].media).toFixed(2)} ${a.variable.unidad} (${a.medias[a.medias.length-1].media?((mejor.media-a.medias[a.medias.length-1].media)/a.medias[a.medias.length-1].media*100).toFixed(1):'—'}%).`
  : `Aunque ${mejor.trat} mostró la media numéricamente más alta (${mejor.media.toFixed(2)} ${a.variable.unidad}), no se puede concluir superioridad estadística frente a los demás tratamientos.`}
${a.medias.some(g=>g.cv>15)?'\n⚠ Uno o más tratamientos presenta CV >15%. Revisar homogeneidad de parcelas.':''}

4. Recomendación agronómica para caña de azúcar
Se recomienda continuar el monitoreo en campo y validar estos resultados en al menos un ciclo agrícola adicional antes de escalar a nivel comercial. Considerar condiciones edafoclimáticas locales y el historial de manejo de las parcelas.
${instr ? '\nNota adicional: '+instr : ''}

Motor estadístico: ${a.motor==='python'?'Python (scipy.stats.f_oneway + statsmodels Tukey HSD)':'R (aov + agricolae HSD.test)'} — simulado en prototipo.
— Generado automáticamente por SIGEC con apoyo de IA (Claude · Anthropic).`;

    resultDiv.innerHTML = `<div class="ai-report-box">${texto}</div>
      <div style="margin-top:12px;display:flex;gap:10px;">
        <button class="btn btn-secondary btn-sm" onclick="copyAIReport()"><i class="fa-solid fa-copy"></i> Copiar texto</button>
        <button class="btn btn-secondary btn-sm" onclick="showToast('success','Descarga simulada','Informe_${ensayo.codigo}.pdf')"><i class="fa-solid fa-file-pdf"></i> Exportar a PDF</button>
      </div>`;
    window.lastAIReportText = texto;
    showToast('success','Reporte generado','El informe narrativo fue creado a partir del análisis estadístico.');
  }, 1400);
}
function copyAIReport(){
  if(!window.lastAIReportText) return;
  navigator.clipboard?.writeText(window.lastAIReportText);
  showToast('success','Copiado','El texto del informe fue copiado al portapapeles.');
}

    const proyNames=mbs.map(m=>{
      const p=PROYECTOS.find(x=>x.id===m.proyectoId);

    return `<tr>
      <td><div style="display:flex;align-items:center;gap:8px;">

      <td>${progs.length?progs.map(p=>`<span class="tag tag-blue" style="margin:2px;">${p}</span>`).join(''):'<span style="color:var(--texto-suave);font-size:12px;">Global / N/A</span>'}</td>

function renderMembershipMatrix(){
  const wrap=document.getElementById('membership-matrix'); if(!wrap) return;
  // Only show users that can have project membership (not admin/director)
  const users=USUARIOS.filter(u=>!['administrador','director'].includes(u.rol));
  if(!users.length||!PROYECTOS.length){wrap.innerHTML='<p style="color:var(--texto-suave);font-size:13px;">Sin usuarios o proyectos disponibles.</p>';return;}
  const initials=k=>k.slice(0,2).toUpperCase();
  const rows=users.map(u=>{
    const cells=PROYECTOS.map(p=>{
      const mb=MEMBERSHIPS.find(m=>m.usuarioId===u.id&&m.proyectoId===p.id);
      const rol=mb?mb.rol:null;
      const r=rol?ROLES[rol]:null;
      return `<td><div class="role-dot ${rol?'':'none'}" style="${r?'background:'+r.color+';':'background:#e8ebe6;color:#8a9a80;'}" onclick="openRoleAssign(${u.id},${p.id},this)" title="${r?r.label:'Sin acceso'}">${rol?initials(rol):'—'}</div></td>`;
    }).join('');
    return `<tr><td class="user-name"><div style="display:flex;align-items:center;gap:7px;">
      <i class="fa-solid ${ROLES[u.rol]?.icon||'fa-user'}" style="color:${ROLES[u.rol]?.color||'#888'};"></i>${u.nombre}
    </div></td>${cells}</tr>`;
  }).join('');
  wrap.innerHTML=`<table class="member-matrix">
    <thead><tr><th class="user-col">Usuario</th>${PROYECTOS.map(p=>`<th title="${p.nombre}">${p.codigo}</th>`).join('')}</tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

function openRoleAssign(usuarioId, proyectoId, dotEl){
  // Remove any open popup
  document.querySelectorAll('.role-select-popup').forEach(el=>el.remove());
  const user=USUARIOS.find(u=>u.id===usuarioId);
  const proy=PROYECTOS.find(p=>p.id===proyectoId);
  const popup=document.createElement('div');
  popup.className='role-select-popup';
  const asignables=['encargado','experto','investigador','muestreador','ingenio'];
  popup.innerHTML=`<div style="font-size:11px;font-weight:700;color:var(--texto-suave);padding:4px 8px 8px;">${user?.nombre} en ${proy?.codigo}</div>`+
    asignables.map(k=>`<div class="role-opt" onclick="setMembership(${usuarioId},${proyectoId},'${k}')">
      <div class="role-dot" style="background:${ROLES[k]?.color};width:22px;height:22px;font-size:9px;">${k.slice(0,2).toUpperCase()}</div>
      <span>${ROLES[k]?.label}</span></div>`).join('')+
    `<div class="role-opt" onclick="removeMembership(${usuarioId},${proyectoId})" style="color:#c4471b;">
      <div class="role-dot none" style="width:22px;height:22px;">—</div><span>Sin acceso</span></div>`;
  const rect=dotEl.getBoundingClientRect();
  popup.style.top=(rect.bottom+window.scrollY+4)+'px';
  popup.style.left=Math.max(8,(rect.left+window.scrollX-60))+'px';
  document.body.appendChild(popup);
  setTimeout(()=>document.addEventListener('click',()=>popup.remove(),{once:true}),0);
}
function setMembership(usuarioId, proyectoId, rol){
  const existing=MEMBERSHIPS.find(m=>m.usuarioId===usuarioId&&m.proyectoId===proyectoId);
  if(existing) existing.rol=rol;
  else MEMBERSHIPS.push({id:nextId(MEMBERSHIPS),usuarioId,proyectoId,rol});
  renderMembershipMatrix();
  renderUsuariosTable();
  const u=USUARIOS.find(x=>x.id===usuarioId)?.nombre||'', p=PROYECTOS.find(x=>x.id===proyectoId)?.codigo||'';
  showToast('success','Acceso asignado',`${u} → ${p} como ${ROLES[rol]?.label}`);
}
function removeMembership(usuarioId, proyectoId){
  MEMBERSHIPS=MEMBERSHIPS.filter(m=>!(m.usuarioId===usuarioId&&m.proyectoId===proyectoId));
  renderMembershipMatrix();
  renderUsuariosTable();
  showToast('warn','Acceso removido','');
}
function openUsuarioModal(id){
  const edit=USUARIOS.find(u=>u.id===id);
  openModal(edit?'Editar usuario':'Nuevo usuario',`
    <div class="form-row">
      <div class="form-group"><label>Nombre completo</label><input id="f-usr-nombre" value="${edit?edit.nombre:''}"></div>
      <div class="form-group"><label>Nombre de usuario</label><input id="f-usr-usuario" value="${edit?edit.usuario:''}"></div>
    </div>
    <div class="form-group"><label>Rol global del sistema</label>
      <select id="f-usr-rol">
        ${Object.entries(ROLES).map(([k,r])=>`<option value="${k}" ${edit&&edit.rol===k?'selected':''}>${r.label}</option>`).join('')}
      </select>
      <p style="font-size:11.5px;color:var(--texto-suave);margin-top:6px;"><i class="fa-solid fa-circle-info" style="margin-right:4px;"></i>El acceso detallado por proyecto se configura en la <b>Matriz de acceso</b> de esta misma página.</p>
    </div>
    <div class="form-group"><label>Programas de investigación</label>
      <div class="checklist">${PROGRAMAS.map(p=>`<label><input type="checkbox" value="${p.id}" class="usr-prog-chk" ${edit&&edit.programas&&edit.programas.includes(p.id)?'checked':''}> ${p.nombre}</label>`).join('')}</div>
    </div>
    <div class="form-group"><label>Ingenio (solo para rol Ingenio)</label>
      <select id="f-usr-ingenio"><option value="">No aplica</option>${INGENIOS.map(i=>`<option ${edit&&edit.ingenio===i?'selected':''}>${i}</option>`).join('')}</select>
    </div>
  `,()=>{
    const nombre=val('f-usr-nombre'),usuario=val('f-usr-usuario'),rol=val('f-usr-rol'),ingenio=val('f-usr-ingenio')||null;
    const programas=Array.from(document.querySelectorAll('.usr-prog-chk:checked')).map(c=>parseInt(c.value));
    if(!nombre.trim()||!usuario.trim()){showToast('error','Faltan datos','Nombre y usuario son obligatorios.');return false;}
    if(edit){Object.assign(edit,{nombre,usuario,rol,ingenio,programas});showToast('success','Usuario actualizado',nombre);}
    else{USUARIOS.push({id:nextId(USUARIOS),nombre,usuario,rol,ingenio,programas});showToast('success','Usuario creado',nombre);}
    renderUsuariosTable();
    return true;
  });
}
function deleteUsuario(id){
  if(id===session.id){showToast('error','No permitido','No puedes eliminar tu propia sesión activa.');return;}
  if(!confirm('¿Eliminar este usuario y sus asignaciones?'))return;
  USUARIOS=USUARIOS.filter(u=>u.id!==id);
  MEMBERSHIPS=MEMBERSHIPS.filter(m=>m.usuarioId!==id);
  renderUsuariosTable();
  showToast('warn','Usuario eliminado','');
}

function emptyState(icon,text){
  return `<div class="empty-state"><i class="fa-solid ${icon}"></i><div>${text}</div></div>`;

function paginationHtml(total,page,size,pageVarName,renderFnName){
  const pages = Math.max(1,Math.ceil(total/size));
  if(pages<=1) return `<span style="font-size:12px;color:var(--texto-suave);">${total} registro${total!==1?'s':''}</span>`;
  let btns='';
  for(let i=1;i<=pages;i++){
    btns += `<div class="page-btn ${i===page?'active':''}" onclick="${pageVarName}=${i};${renderFnName}()">${i}</div>`;
  }
  return `<span style="font-size:12px;color:var(--texto-suave);margin-right:10px;">${total} registros</span>${btns}`;
}

/* ---------------- MODAL ---------------- */
let modalConfirmFn = null;
function openModal(title, bodyHtml, onConfirm, readOnly){
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = bodyHtml;
  const foot = document.getElementById('modal-foot');
  if(readOnly){
    foot.innerHTML = `<button class="btn btn-secondary" onclick="closeModal()">Cerrar</button>`;
  } else {
    modalConfirmFn = onConfirm;
    foot.innerHTML = `
      <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="confirmModal()"><i class="fa-solid fa-check"></i> Guardar</button>`;
  }
  document.getElementById('modal-overlay').classList.add('show');
}
function confirmModal(){
  if(modalConfirmFn){
    const ok = modalConfirmFn();
    if(ok===false) return;
  }
  closeModal();
}
function closeModal(){
  document.getElementById('modal-overlay').classList.remove('show');
  modalConfirmFn = null;
}
document.getElementById('modal-overlay').addEventListener('click',(e)=>{
  if(e.target.id==='modal-overlay') closeModal();
});

/* ---------------- TOASTS ---------------- */
function showToast(type,title,msg){
  const wrap = document.getElementById('toast-wrap');
  const icon = type==='error'?'fa-circle-exclamation':type==='warn'?'fa-triangle-exclamation':'fa-circle-check';
  const el = document.createElement('div');
  el.className = `toast ${type==='success'?'':type}`;
  el.innerHTML = `<i class="fa-solid ${icon}"></i><div><b>${title}</b><span>${msg||''}</span></div>`;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transform='translateX(20px)'; el.style.transition='.25s'; setTimeout(()=>el.remove(),250); }, 3200);
}
