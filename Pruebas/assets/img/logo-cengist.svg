<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-label="Símbolo CengiST: llave de herramienta, engranaje de servicio técnico y caña de azúcar">
  <defs>
    <linearGradient id="st-anillo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bcf32e"/>
      <stop offset="1" stop-color="#5aa816"/>
    </linearGradient>
    <radialGradient id="st-fondo" cx=".45" cy=".4" r=".7">
      <stop offset="0" stop-color="#0d5a22"/>
      <stop offset="1" stop-color="#03300f"/>
    </radialGradient>
    <linearGradient id="st-cana" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4ffe0"/>
      <stop offset="1" stop-color="#a9dc4c"/>
    </linearGradient>
    <linearGradient id="st-hoja" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7cc62a"/>
      <stop offset="1" stop-color="#e9ffb8"/>
    </linearGradient>
    <clipPath id="st-dentro"><circle cx="290" cy="250" r="156"/></clipPath>
  </defs>

  <!-- Llave de herramienta (equivale al mango de la lupa de Cengitech) -->
  <g transform="translate(178 362) rotate(-45)">
    <mask id="st-boca"><rect x="-260" y="-80" width="300" height="160" fill="#fff"/><rect x="-206" y="-15" width="58" height="30" rx="4" fill="#000"/><circle cx="-150" cy="0" r="15" fill="#000"/></mask>
    <rect x="-126" y="-15" width="132" height="30" rx="15" fill="#f4ffe0" stroke="url(#st-anillo)" stroke-width="8"/>
    <circle cx="-148" cy="0" r="40" fill="#FFCC00" stroke="#c99a00" stroke-width="5" mask="url(#st-boca)"/>
    <circle cx="-30" cy="0" r="6" fill="#5aa816"/>
  </g>

  <!-- Servicio: ruta punteada y engranaje (equivale a los nodos de Cengitech) -->
  <g>
    <path d="M446 190 C 486 216, 532 214, 560 186" fill="none" stroke="#FFCC00" stroke-width="10" stroke-linecap="round" stroke-dasharray="3 22"/>
    <g transform="translate(616 118)">
      <g fill="url(#st-anillo)">
        <rect x="-13" y="-70" width="26" height="30" rx="6"/>
        <rect x="-13" y="-70" width="26" height="30" rx="6" transform="rotate(45)"/>
        <rect x="-13" y="-70" width="26" height="30" rx="6" transform="rotate(90)"/>
        <rect x="-13" y="-70" width="26" height="30" rx="6" transform="rotate(135)"/>
        <rect x="-13" y="-70" width="26" height="30" rx="6" transform="rotate(180)"/>
        <rect x="-13" y="-70" width="26" height="30" rx="6" transform="rotate(225)"/>
        <rect x="-13" y="-70" width="26" height="30" rx="6" transform="rotate(270)"/>
        <rect x="-13" y="-70" width="26" height="30" rx="6" transform="rotate(315)"/>
        <circle r="50"/>
      </g>
      <circle r="24" fill="#f4ffe0"/>
      <circle r="11" fill="#0b4a1f"/>
    </g>
    <ellipse cx="616" cy="200" rx="38" ry="8" fill="#bcf32e" opacity=".45"/>
  </g>

  <!-- Anillo -->
  <circle cx="290" cy="250" r="178" fill="url(#st-fondo)" stroke="url(#st-anillo)" stroke-width="44"/>

  <!-- Interior: caña y hojas -->
  <g clip-path="url(#st-dentro)">
    <g transform="rotate(-8 262 260)">
      <rect x="240" y="128" width="44" height="74" rx="12" fill="url(#st-cana)"/>
      <rect x="240" y="208" width="44" height="80" rx="12" fill="url(#st-cana)"/>
      <rect x="240" y="294" width="44" height="80" rx="12" fill="url(#st-cana)"/>
      <rect x="240" y="380" width="44" height="60" rx="12" fill="url(#st-cana)"/>
    </g>
    <g transform="rotate(22 330 330)">
      <rect x="312" y="270" width="36" height="62" rx="10" fill="url(#st-cana)" opacity=".95"/>
      <rect x="312" y="338" width="36" height="70" rx="10" fill="url(#st-cana)" opacity=".95"/>
    </g>
    <path d="M268 236 C 276 160, 330 112, 404 104 C 372 146, 330 196, 268 236 Z" fill="url(#st-hoja)"/>
    <path d="M276 196 C 300 176, 340 156, 380 150" fill="none" stroke="#0d5a22" stroke-width="4" stroke-linecap="round" opacity=".35"/>
    <path d="M256 290 C 222 236, 186 214, 150 214 C 178 246, 206 280, 256 290 Z" fill="url(#st-hoja)" opacity=".9"/>
    <path d="M300 268 C 344 236, 392 232, 430 248 C 392 262, 350 278, 300 268 Z" fill="url(#st-hoja)" opacity=".8"/>
  </g>
</svg>
