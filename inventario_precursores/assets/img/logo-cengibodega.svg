<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-label="Símbolo CengiBodega: frasco de reactivo, cajas de bodega y caña de azúcar">
  <defs>
    <linearGradient id="cc-anillo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bcf32e"/>
      <stop offset="1" stop-color="#5aa816"/>
    </linearGradient>
    <radialGradient id="cc-fondo" cx=".45" cy=".4" r=".7">
      <stop offset="0" stop-color="#0d5a22"/>
      <stop offset="1" stop-color="#03300f"/>
    </radialGradient>
    <linearGradient id="cc-cana" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4ffe0"/>
      <stop offset="1" stop-color="#a9dc4c"/>
    </linearGradient>
    <linearGradient id="cc-hoja" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7cc62a"/>
      <stop offset="1" stop-color="#e9ffb8"/>
    </linearGradient>
    <clipPath id="cc-dentro"><circle cx="290" cy="250" r="156"/></clipPath>
  </defs>
  <!-- Frasco de reactivo con etiqueta de lote (equivale al mango de la lupa de Cengitech) -->
  <g transform="translate(178 362) rotate(-45)">
    <clipPath id="cb-frasco"><rect x="-150" y="-34" width="162" height="68" rx="20"/></clipPath>
    <rect x="-206" y="-17" width="26" height="34" rx="7" fill="#FFCC00"/>
    <rect x="-184" y="-13" width="38" height="26" rx="6" fill="#eaffc4"/>
    <rect x="-150" y="-34" width="162" height="68" rx="20" fill="#eaffc4"/>
    <g clip-path="url(#cb-frasco)">
      <rect x="-60" y="-40" width="80" height="80" fill="url(#cc-anillo)"/>
    </g>
    <rect x="-132" y="-22" width="64" height="44" rx="7" fill="#f4ffe0" stroke="#5aa816" stroke-width="3"/>
    <g fill="#0b4a1f">
      <rect x="-124" y="-14" width="4" height="28"/><rect x="-116" y="-14" width="7" height="28"/>
      <rect x="-105" y="-14" width="3" height="28"/><rect x="-98" y="-14" width="6" height="28"/>
      <rect x="-88" y="-14" width="3" height="28"/><rect x="-82" y="-14" width="5" height="28"/>
    </g>
    <rect x="-150" y="-34" width="162" height="68" rx="20" fill="none" stroke="url(#cc-anillo)" stroke-width="9"/>
  </g>

  <!-- Cajas apiladas de bodega (equivale a los nodos de circuito de Cengitech) -->
  <g>
    <ellipse cx="582" cy="230" rx="104" ry="10" fill="#bcf32e" opacity=".35"/>
    <rect x="486" y="140" width="90" height="84" rx="10" fill="url(#cc-anillo)"/>
    <rect x="586" y="140" width="90" height="84" rx="10" fill="url(#cc-anillo)"/>
    <rect x="536" y="48" width="90" height="86" rx="10" fill="url(#cc-anillo)"/>
    <g fill="#FFCC00">
      <rect x="522" y="140" width="18" height="34" rx="3"/>
      <rect x="622" y="140" width="18" height="34" rx="3"/>
      <rect x="572" y="48" width="18" height="36" rx="3"/>
    </g>
    <g fill="#f4ffe0">
      <rect x="500" y="196" width="34" height="14" rx="4"/>
      <rect x="600" y="196" width="34" height="14" rx="4"/>
      <rect x="550" y="106" width="34" height="14" rx="4"/>
    </g>
    <g fill="#d9ff7a" opacity=".45">
      <rect x="486" y="140" width="90" height="10" rx="5"/>
      <rect x="586" y="140" width="90" height="10" rx="5"/>
      <rect x="536" y="48" width="90" height="10" rx="5"/>
    </g>
  </g>
  <!-- Anillo -->
  <circle cx="290" cy="250" r="178" fill="url(#cc-fondo)" stroke="url(#cc-anillo)" stroke-width="44"/>

  <!-- Interior: caña y hojas -->
  <g clip-path="url(#cc-dentro)">
    <g transform="rotate(-8 262 260)">
      <rect x="240" y="128" width="44" height="74" rx="12" fill="url(#cc-cana)"/>
      <rect x="240" y="208" width="44" height="80" rx="12" fill="url(#cc-cana)"/>
      <rect x="240" y="294" width="44" height="80" rx="12" fill="url(#cc-cana)"/>
      <rect x="240" y="380" width="44" height="60" rx="12" fill="url(#cc-cana)"/>
    </g>
    <g transform="rotate(22 330 330)">
      <rect x="312" y="270" width="36" height="62" rx="10" fill="url(#cc-cana)" opacity=".95"/>
      <rect x="312" y="338" width="36" height="70" rx="10" fill="url(#cc-cana)" opacity=".95"/>
    </g>
    <path d="M268 236 C 276 160, 330 112, 404 104 C 372 146, 330 196, 268 236 Z" fill="url(#cc-hoja)"/>
    <path d="M276 196 C 300 176, 340 156, 380 150" fill="none" stroke="#0d5a22" stroke-width="4" stroke-linecap="round" opacity=".35"/>
    <path d="M256 290 C 222 236, 186 214, 150 214 C 178 246, 206 280, 256 290 Z" fill="url(#cc-hoja)" opacity=".9"/>
    <path d="M300 268 C 344 236, 392 232, 430 248 C 392 262, 350 278, 300 268 Z" fill="url(#cc-hoja)" opacity=".8"/>
  </g>
</svg>
