# Una sola implementación; los enlaces antiguos conservan método y parámetros.
RedirectMatch 308 ^/cengisalas/modules/visitas(?:/(.*))?$ /visitas/$1
RedirectMatch 308 ^/Pruebas/public/(.*)$ /visitas/public/$1
<Directory /var/www/html/visitas>
    php_value auto_prepend_file /var/www/html/visitas/config/session_namespace.php
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
</Directory>
<Directory /var/www/html/visitas/config>
    Require all denied
</Directory>
<Directory /var/www/html/visitas/vendor>
    Require all denied
</Directory>
<Directory /var/www/html/visitas/uploads>
    <FilesMatch "\.(php|php[3-8]?|phtml|pl|py|cgi|asp|aspx|sh|exe)$">
        Require all denied
    </FilesMatch>
</Directory>
