# Páginas 404 personalizadas por módulo (login/ y cengicursos/, el alcance
# de producción confirmado). Rutas relativas al DocumentRoot.
<Directory "/var/www/html/login">
    ErrorDocument 404 /login/404.php
</Directory>

<Directory "/var/www/html/cengicursos">
    ErrorDocument 404 /cengicursos/404.php
</Directory>
