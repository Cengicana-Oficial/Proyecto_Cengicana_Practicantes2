; Errores de PHP: se registran en el log del contenedor (docker logs) y no se imprimen en la
; respuesta. Sin esto, cualquier aviso (Deprecated, Warning) se escribía dentro de las
; descargas de Excel/PDF y el archivo quedaba dañado, además de mostrar rutas internas.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL
