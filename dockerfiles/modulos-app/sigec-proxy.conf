# Reenvia todo lo bajo /sigec al contenedor "sigec" (nombre de servicio de
# docker-compose.prod.yml, resuelto por la red interna de Docker). Con esto
# SIGEC queda accesible en modulos.cengicana.org/sigec/... sin exponer su
# puerto (8087) publicamente y sin necesitar un subdominio propio.
#
# El prefijo /sigec se descarta al reenviar (ProxyPass /sigec/ -> .../),
# asi que dentro del contenedor sigec las peticiones llegan como si /sigec
# no existiera. Laravel no sabe por si solo que esta detras de ese prefijo,
# por eso sigec/app/Providers/AppServiceProvider.php fuerza la URL raiz
# (config('app.url'), que debe incluir /sigec) para que los enlaces y
# assets que genera Laravel se calculen con el prefijo correcto.
ProxyPass /sigec/ http://sigec/
ProxyPassReverse /sigec/ http://sigec/
