# Los archivos bajo cualquier carpeta uploads/ (/uploads, sistema_de_solicitudes/uploads,
# Pruebas/uploads...) son subidos por usuarios finales y nunca deben ejecutarse como scripts,
# incluso si un archivo malicioso lograra pasar la validacion de extension/MIME en la aplicacion.
<DirectoryMatch "^/var/www/html/(.+/)?uploads(/|$)">
    <FilesMatch "\.(php|php[3-8]?|phar|phtml|pht|pl|py|cgi|asp|aspx|sh|exe)$">
        Require all denied
    </FilesMatch>
    <IfModule mod_php.c>
        php_admin_flag engine off
    </IfModule>
</DirectoryMatch>

# login/storage guarda estado interno (throttle de intentos de login) y no debe
# ser accesible por HTTP bajo ninguna circunstancia.
<Directory "/var/www/html/login/storage">
    Require all denied
</Directory>
