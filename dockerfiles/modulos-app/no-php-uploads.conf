# Los archivos bajo /uploads son subidos por usuarios finales y nunca deben ejecutarse como scripts,
# incluso si un archivo malicioso lograra pasar la validacion de extension/MIME en la aplicacion.
<Directory "/var/www/html/uploads">
    <FilesMatch "\.(php|php[3-8]?|phtml|pl|py|cgi|asp|aspx|sh|exe)$">
        Require all denied
    </FilesMatch>
</Directory>

# login/storage guarda estado interno (throttle de intentos de login) y no debe
# ser accesible por HTTP bajo ninguna circunstancia.
<Directory "/var/www/html/login/storage">
    Require all denied
</Directory>
