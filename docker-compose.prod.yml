name: cengicana-ui-new

services:
  app:
    build:
      context: .
      dockerfile: dockerfiles/modulos-app/Dockerfile
    container_name: cengicana-ui-new-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8085:80"
    environment:
      TZ: America/Guatemala
    volumes:
      - ./deploy/env/login.env:/var/www/html/login/.env:ro
      - ./deploy/env/cengicursos.env:/var/www/html/cengicursos/.env:ro
      - ./deploy/env/laboratorio.env:/var/www/html/laboratorio/.env:ro
      - ./uploads:/var/www/html/uploads
    depends_on:
      - mysql

  sigec:
    build:
      context: .
      dockerfile: dockerfiles/sigec-app/Dockerfile
    container_name: cengicana-ui-new-sigec
    restart: unless-stopped
    ports:
      - "127.0.0.1:8087:80"
    environment:
      TZ: America/Guatemala
    volumes:
      - ./deploy/env/sigec.env:/var/www/html/sigec/.env:ro
      - sigec-storage:/var/www/html/sigec/storage/app/public
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: cengicana-ui-new-mysql
    restart: unless-stopped
    env_file:
      - ./deploy/env/mysql.env
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "127.0.0.1:33063:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/mysql/init:/docker-entrypoint-initdb.d:ro

volumes:
  mysql-data:
    name: cengicana-ui-new-mysql-data
  sigec-storage:
    name: cengicana-ui-new-sigec-storage
